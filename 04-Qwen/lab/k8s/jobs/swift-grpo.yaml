# ms-swift GRPO (Chapter 08): LoRA GRPO of Qwen2.5-1.5B-Instruct on NuminaMath-TIR with
# rule-based rewards — accuracy (math_verify against the dataset's solution) and format
# (<think>…</think><answer>…</answer>). A Kueue-admitted Job in batch on spark-root,
# training window only (see swift-sft.yaml for the window commands).
#   kubectl --context spark-root apply -f k8s/jobs/swift-grpo.yaml
#   kubectl --context spark-root -n batch logs -f job/swift-grpo     # watch reward and completion length
#
# Rollouts use the Hugging Face generate() path here: slow, but it needs nothing beyond
# the PyTorch image. Faster: run the Job on the lab's vLLM image (versions.env VLLM_IMAGE)
# and add  --use_vllm true --vllm_mode colocate --vllm_gpu_memory_utilization 0.25 --sleep_level 1
# — the colocated engine then lives inside this pod's 64Gi, so keep util × 121.7 GiB plus
# the training state below the limit.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: qwen-train, namespace: batch}
spec:
  storageClassName: local-nvme-retain
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 60Gi}}     # shared by swift-sft/dpo/grpo; batch-budget: 200Gi of storage
---
apiVersion: batch/v1
kind: Job
metadata:
  name: swift-grpo
  namespace: batch
  labels: {kueue.x-k8s.io/queue-name: train, kueue.x-k8s.io/priority-class: routine, app: qwen-swift}
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app: qwen-swift, job: swift-grpo}}
    spec:
      restartPolicy: Never
      priorityClassName: spark-batch
      containers:
        - name: swift
          image: nvcr.io/nvidia/pytorch:26.08-py3
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              pip install --quiet "ms-swift==4.5.3" "transformers==5.16.1" "trl==0.29.1" "peft==0.20.0" "datasets==4.8.4" "accelerate==1.15.0" "math-verify==0.9.0"
              swift rlhf \
                --rlhf_type grpo \
                --model "$MODEL" \
                --use_hf true \
                --tuner_type lora \
                --dataset "$DATASET" \
                --reward_funcs accuracy format \
                --system "$SYSTEM_PROMPT" \
                --num_generations 4 \
                --per_device_train_batch_size 4 \
                --gradient_accumulation_steps 2 \
                --max_completion_length 1024 \
                --temperature 0.9 \
                --beta 0.04 \
                --torch_dtype bfloat16 \
                --max_steps 200 \
                --learning_rate 1e-5 \
                --lora_rank 16 \
                --lora_alpha 32 \
                --target_modules all-linear \
                --max_length 2048 \
                --save_steps 50 \
                --save_total_limit 2 \
                --logging_steps 5 \
                --warmup_ratio 0.05 \
                --dataset_num_proc 4 \
                --report_to tensorboard \
                --output_dir /work/output/grpo
          env:
            - {name: MODEL, value: Qwen/Qwen2.5-1.5B-Instruct}
            - {name: DATASET, value: "AI-MO/NuminaMath-TIR#1000"}   # problem + solution (the accuracy reward's reference)
            - name: SYSTEM_PROMPT
              value: >-
                A conversation between User and Assistant. The Assistant first thinks about the reasoning process
                and then gives the answer. The reasoning is enclosed in <think> </think> and the answer in
                <answer> </answer> tags, i.e. <think> reasoning </think><answer> answer </answer>.
            - {name: HF_HOME, value: /work/hf}
            - {name: MODELSCOPE_CACHE, value: /work/modelscope}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
            - name: HF_TOKEN
              valueFrom: {secretKeyRef: {name: hf-token, key: token, optional: true}}
          resources:            # request = limit, inside the training window (≤ 8 CPU · 80 Gi · 1 slice)
            requests: {cpu: "6", memory: 64Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "6", memory: 64Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: work, persistentVolumeClaim: {claimName: qwen-train}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 4Gi}}
