# Quantise Qwen2.5-7B-Instruct to FP8 and to W4A16 with llm-compressor (Volume 13).
# Writes into the shared model cache (/models/quantized/…) so vLLM can serve the result.
# llm-compressor 0.8.1 declares torch<=2.8; --no-deps keeps the NGC image's torch build.
#   kubectl apply -f k8s/jobs/quantize.yaml && kubectl -n llm-serving logs -f job/quantize
apiVersion: batch/v1
kind: Job
metadata: {name: quantize, namespace: llm-serving}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      priorityClassName: spark-batch
      containers:
        - name: quantize
          image: nvcr.io/nvidia/pytorch:25.09-py3
          command: ["bash", "-c"]
          args:
            - >-
              pip install --quiet transformers==4.56.2 accelerate==1.10.1 datasets==4.1.1
              "loguru>=0.7.2,<=0.7.3" "nvidia-ml-py>=12.560.30" "pydantic>=2.0" &&
              pip install --quiet --no-deps llmcompressor==0.8.1 compressed-tensors==0.12.2 &&
              python3 /app/tools/quantize.py --model Qwen/Qwen2.5-7B-Instruct --scheme fp8 --out /models/quantized/qwen2.5-7b-fp8 &&
              python3 /app/tools/quantize.py --model Qwen/Qwen2.5-7B-Instruct --scheme w4a16 --out /models/quantized/qwen2.5-7b-w4a16
          env:
            - {name: HF_HOME, value: /models/hf}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
          resources:
            requests: {cpu: "4", memory: 24Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "8", memory: 64Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: tools, mountPath: /app/tools}
            - {name: data, mountPath: /app/data}
            - {name: models, mountPath: /models}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: tools, configMap: {name: qwen-tools}}
        - {name: data, configMap: {name: qwen-data}}
        - {name: models, persistentVolumeClaim: {claimName: model-cache}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
