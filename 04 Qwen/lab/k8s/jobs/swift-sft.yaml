# LoRA SFT of Qwen2.5-7B-Instruct with ms-swift on the verified synthetic data (Volumes 06-07, 09-10).
# Data: kubectl -n batch create configmap swift-data --from-file=sft.jsonl=data/synth/sft.jsonl --from-file=dpo.jsonl=data/synth/dpo.jsonl
# USE_HF=1 makes ms-swift download from Hugging Face instead of ModelScope.
apiVersion: batch/v1
kind: Job
metadata:
  name: swift-sft
  namespace: batch
  labels: {kueue.x-k8s.io/queue-name: train, kueue.x-k8s.io/priority-class: routine}
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      priorityClassName: spark-batch
      containers:
        - name: train
          image: nvcr.io/nvidia/pytorch:25.09-py3
          command: ["bash", "-c"]
          args:
            - >-
              pip install --quiet ms-swift==3.8.3 trl==0.20.0 transformers==4.56.2 peft==0.17.1 accelerate==1.10.1 datasets==3.6.0 &&
              swift sft --model Qwen/Qwen2.5-7B-Instruct --train_type lora --dataset /data/sft.jsonl
              --torch_dtype bfloat16 --num_train_epochs 2 --per_device_train_batch_size 4 --gradient_accumulation_steps 4
              --learning_rate 1e-4 --lora_rank 16 --lora_alpha 32 --target_modules all-linear --max_length 2048
              --gradient_checkpointing true --logging_steps 5 --save_steps 50 --report_to none
              --output_dir /ckpt/swift-sft --add_version false &&
              CK=$(ls -d /ckpt/swift-sft/checkpoint-* | sort -V | tail -1) && echo "last checkpoint: $CK" &&
              swift export --adapters "$CK" --merge_lora true --output_dir /ckpt/swift-sft-merged
          env:
            - {name: USE_HF, value: "1"}
            - {name: HF_HOME, value: /ckpt/hf}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
          resources:
            requests: {cpu: "4", memory: 24Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: 48Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: ckpt, mountPath: /ckpt}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: data, configMap: {name: swift-data}}
        - {name: ckpt, persistentVolumeClaim: {claimName: deepseek-ckpt}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
