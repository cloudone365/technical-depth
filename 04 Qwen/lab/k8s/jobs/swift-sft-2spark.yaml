# Full-parameter SFT of Qwen2.5-7B across two Sparks with ms-swift + DeepSpeed ZeRO-3 (Volume 07).
# One rank per Spark over CX-7 (hostNetwork, NCCL/RoCE); ms-swift launches torchrun from
# NNODES / NODE_RANK / MASTER_ADDR / NPROC_PER_NODE.
apiVersion: v1
kind: Service
metadata: {name: swift-2spark, namespace: batch}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {job-name: swift-2spark}
  ports: [{port: 29500}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: swift-2spark
  namespace: batch
  labels: {kueue.x-k8s.io/queue-name: train, kueue.x-k8s.io/priority-class: routine}
spec:
  suspend: true
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  template:
    spec:
      subdomain: swift-2spark
      restartPolicy: Never
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: spark-batch
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {job-name: swift-2spark}}
      containers:
        - name: train
          image: nvcr.io/nvidia/pytorch:25.09-py3
          command: ["bash", "-c"]
          args:
            - >-
              pip install --quiet ms-swift==3.8.3 trl==0.20.0 transformers==4.56.2 peft==0.17.1 accelerate==1.10.1
              datasets==3.6.0 deepspeed==0.17.6 &&
              NODE_RANK=$JOB_COMPLETION_INDEX swift sft --model Qwen/Qwen2.5-7B-Instruct --train_type full
              --dataset /data/sft.jsonl --torch_dtype bfloat16 --deepspeed zero3 --num_train_epochs 1
              --per_device_train_batch_size 2 --gradient_accumulation_steps 8 --learning_rate 1e-5 --max_length 2048
              --gradient_checkpointing true --logging_steps 5 --save_strategy no --report_to none
              --output_dir /ckpt/swift-full --add_version false
          env:
            - {name: NNODES, value: "2"}
            - {name: NPROC_PER_NODE, value: "1"}
            - {name: MASTER_ADDR, value: 192.168.100.11}
            - {name: MASTER_PORT, value: "29500"}
            - {name: USE_HF, value: "1"}
            - {name: HF_HOME, value: /ckpt/hf}
            - {name: NCCL_SOCKET_IFNAME, value: enp1s0f1np1}
            - {name: NCCL_IB_HCA, value: "rocep1s0f1,roceP2p1s0f1"}
            - {name: NCCL_IB_GID_INDEX, value: "3"}
          securityContext: {capabilities: {add: [IPC_LOCK]}}
          resources:
            requests: {cpu: "8", memory: 32Gi, nvidia.com/gpu: "1"}
            limits: {memory: 100Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: ckpt, mountPath: /ckpt}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: data, configMap: {name: swift-data}}
        - {name: ckpt, emptyDir: {}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}
