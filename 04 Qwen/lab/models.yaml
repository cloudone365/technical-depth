# Qwen model catalog for the 04 Qwen lab (Volumes 01-05, 11, 13, 17, 19-22).
# Same schema as "03 DeepSeek/lab/models.yaml"; overlays are generated by 03's
# gen_overlays.py (scripts/gen-overlays.sh) and served by 03's serve-model.sh
# (scripts/serve-model.sh sets DS_DIR to this lab). One chat model at a time,
# except the side-by-side overlays of 03's k8s/multi pattern.
#
# util      vLLM --gpu-memory-utilization (fraction of ≈119.7 GiB)
# mem       pod memory limit
# weights   approximate weight size on disk
# revision  optional Hugging Face commit SHA (03 Vol 33)
# smoke     'none' skips serve-model.sh's chat smoke test (base models)
models:
  - name: qwen2.5-0.5b
    hf: Qwen/Qwen2.5-0.5B-Instruct
    util: 0.08
    max_len: 32768
    mem: 16Gi
    weights: 1GB
    args: []
    use: smallest Qwen; draft model and smoke tests (Vol 01, 11)
  - name: qwen2.5-7b
    hf: Qwen/Qwen2.5-7B-Instruct
    util: 0.30
    max_len: 32768
    mem: 32Gi
    weights: 15GB
    args: [--enable-auto-tool-choice, --tool-call-parser=hermes]
    use: the reference Qwen2.5 instruct model with tool calling (Vol 01, 11, 17)
  - name: qwen2.5-7b-128k
    hf: Qwen/Qwen2.5-7B-Instruct
    util: 0.45
    max_len: 131072
    mem: 48Gi
    weights: 15GB
    args: ['--hf-overrides={"rope_scaling": {"rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 32768}}',
           --enable-chunked-prefill, --max-num-batched-tokens=8192]
    use: YaRN ×4 context extension to 128K (Vol 02, 18)
  - name: qwen2.5-14b
    hf: Qwen/Qwen2.5-14B-Instruct
    util: 0.40
    max_len: 32768
    mem: 48Gi
    weights: 30GB
    args: [--enable-auto-tool-choice, --tool-call-parser=hermes]
    use: mid-size dense model, BF16 (Vol 01, 13)
  - name: qwen2.5-32b-awq
    hf: Qwen/Qwen2.5-32B-Instruct-AWQ
    util: 0.40
    max_len: 32768
    mem: 48Gi
    weights: 19GB
    args: [--quantization=awq_marlin, --max-num-seqs=32, --enable-auto-tool-choice, --tool-call-parser=hermes]
    use: largest Qwen2.5 that fits comfortably next to apps (Vol 13)
  - name: qwen2.5-coder-7b
    hf: Qwen/Qwen2.5-Coder-7B-Instruct
    util: 0.30
    max_len: 32768
    mem: 32Gi
    weights: 15GB
    args: [--enable-auto-tool-choice, --tool-call-parser=hermes]
    use: code chat, repo questions (Vol 03)
  - name: qwen2.5-coder-7b-base
    hf: Qwen/Qwen2.5-Coder-7B
    util: 0.30
    max_len: 32768
    mem: 32Gi
    weights: 15GB
    args: []
    smoke: none          # base model: no chat smoke test; Vol 03 uses /v1/completions FIM instead
    use: fill-in-the-middle completion for editors — FIM is a base-model task (Vol 03)
  - name: qwen2.5-coder-32b-awq
    hf: Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
    util: 0.40
    max_len: 32768
    mem: 48Gi
    weights: 19GB
    args: [--quantization=awq_marlin, --max-num-seqs=32]
    use: strongest Qwen coder on one Spark (Vol 03)
  - name: qwen2.5-math-7b
    hf: Qwen/Qwen2.5-Math-7B-Instruct
    util: 0.30
    max_len: 4096
    mem: 32Gi
    weights: 15GB
    args: []
    use: math CoT and tool-integrated reasoning; 4K context by design (Vol 04)
  - name: qwen2.5-vl-7b
    hf: Qwen/Qwen2.5-VL-7B-Instruct
    util: 0.40
    max_len: 32768
    mem: 48Gi
    weights: 17GB
    args: ['--limit-mm-per-prompt={"image": 4, "video": 1}', --max-num-seqs=16]
    use: vision-language — documents, charts, screenshots, video frames (Vol 05, 19)
  - name: qwq-32b-awq
    hf: Qwen/QwQ-32B-AWQ
    util: 0.40
    max_len: 32768
    mem: 48Gi
    weights: 20GB
    args: [--quantization=awq_marlin, --max-num-seqs=32, --reasoning-parser=deepseek_r1]
    use: Qwen's RL-trained reasoning model (Vol 04)
