# expect: deny
# cluster: dev-llms
# VAP spark-serving-needs-readiness — the sandbox follows the same rules as llm-serving
apiVersion: apps/v1
kind: Deployment
metadata: {name: pt-sandbox-noready, namespace: llm-sandbox}
spec:
  selector: {matchLabels: {app: pt}}
  template:
    metadata: {labels: {app: pt}}
    spec:
      containers:
        - name: c
          image: registry.k8s.io/pause:3.10
          resources: {limits: {memory: 32Mi}}
