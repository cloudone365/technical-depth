# expect: deny
# cluster: dev-lab
# LimitRange max cpu 500m (dev-lab/10-tenancy/limitranges.yaml)
apiVersion: v1
kind: Pod
metadata: {name: pt-deny-over-limitrange, namespace: tenant-alpha}
spec:
  securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: c
      image: registry.k8s.io/pause:3.10
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      resources: {limits: {cpu: "2", memory: 32Mi}}
