# Namespaces INSIDE vCluster #1 · dev-lab (Steps 14, 04). Apply with
# --context dev-lab. Labels drive admission policies, NetworkPolicies and Pod
# Security Admission — enforced by dev-lab's own API server. On the root these
# pods all land in host namespace vc-dev-lab (PSA baseline there).
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-alpha
  labels:
    spark.lab/tenant: "true"
    spark.lab/team: alpha                  # training / notebooks
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-beta
  labels:
    spark.lab/tenant: "true"
    spark.lab/team: beta                   # inference prototyping
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab-tools
  labels:
    # netshoot, echo, DNS and scheduling labs, break/fix drills. Node-level
    # (privileged / host-network) tools moved to the root's platform-tools,
    # so baseline is enough — and the root's vc-dev-lab namespace would
    # refuse anything more anyway.
    spark.lab/tier: tools
    pod-security.kubernetes.io/enforce: baseline
