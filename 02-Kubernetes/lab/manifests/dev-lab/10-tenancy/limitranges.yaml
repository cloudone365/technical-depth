# Defaults so a pod without resources still lands inside the tenant quota (Chapter 14).
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: tenant-alpha
spec:
  limits:
    - type: Container
      default: {cpu: 250m, memory: 512Mi}
      defaultRequest: {cpu: 100m, memory: 256Mi}
      max: {cpu: 500m, memory: 2Gi}
    - type: PersistentVolumeClaim
      max: {storage: 50Gi}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: tenant-beta
spec:
  limits:
    - type: Container
      default: {cpu: 250m, memory: 512Mi}
      defaultRequest: {cpu: 100m, memory: 256Mi}
      max: {cpu: 500m, memory: 2Gi}
    - type: PersistentVolumeClaim
      max: {storage: 50Gi}
---
# lab-tools has no quota (instructor namespace) but needs defaults: the root
# vc-dev-lab quota caps memory, so every container must declare memory.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: lab-tools
spec:
  limits:
    - type: Container
      default: {memory: 256Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
