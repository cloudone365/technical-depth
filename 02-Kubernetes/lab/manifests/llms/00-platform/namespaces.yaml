# Namespaces INSIDE vCluster #2 · llms (Chapters 20, 04). Apply with --context llms.
# On the root these pods all land in host namespace vc-llms.
apiVersion: v1
kind: Namespace
metadata:
  name: llm-serving
  labels:
    spark.lab/tier: serving
    # NGC serving images run as root and need /dev/shm → baseline, not restricted
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: batch
  labels:
    spark.lab/tier: batch                  # Kueue-managed training jobs
    kueue.x-k8s.io/managed: "true"
    # Multi-node NCCL needs hostNetwork or IPC_LOCK (RDMA pinned memory), which
    # baseline forbids. Enforce privileged, but WARN at baseline so anything
    # unusual is visible on every apply (Chapter 18). The root's vc-llms
    # namespace is privileged for the same reason.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress
  labels:
    spark.lab/tier: platform               # Traefik for the llms API (addons/traefik-values.yaml)
    pod-security.kubernetes.io/enforce: baseline
