# vLLM OpenAI-compatible server on one GB10 time-slice, INSIDE vCluster #2 · llms
# (Steps 20, 04). Apply with --context llms.
#
# Two memory budgets, both must hold:
#   1. vLLM's own: --gpu-memory-utilization is a fraction of the ~119.7 GiB the
#      GPU reports — i.e. of the SAME memory the OS, Kubernetes and every other
#      pod use. 0.20 ≈ 24 GiB (weights + KV cache).
#   2. The llms vCluster's: 48 Gi of memory limits for EVERYTHING in it (root
#      quota on vc-llms). The 32 Gi limit below leaves room for Traefik, Kueue,
#      KEDA, the control plane and a second model server. Whether CUDA memory
#      is charged to this limit is measured in Step 14 §5.5 — size as if it is.
apiVersion: v1
kind: Secret
metadata: {name: hf-token, namespace: llm-serving}
type: Opaque
stringData:
  token: "replace-me"                  # or sync from Vault (01-Ansible Step 18)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm-serving
  labels: {app: vllm, model: qwen2-5-0-5b}
spec:
  replicas: 1
  strategy:
    type: Recreate                     # a 2nd copy during rollout would double UMA use
  selector: {matchLabels: {app: vllm}}
  template:
    metadata:
      labels: {app: vllm, model: qwen2-5-0-5b}
    spec:
      priorityClassName: spark-serving
      terminationGracePeriodSeconds: 120   # longer than the longest expected generation (Step 09 §5.6)
      containers:
        - name: vllm
          image: nvcr.io/nvidia/vllm:25.09-py3
          command: ["vllm", "serve"]
          args:
            - "$(MODEL)"
            - "--served-model-name=$(SERVED_NAME)"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--gpu-memory-utilization=0.20"
            - "--max-model-len=8192"
            - "--max-num-seqs=64"
            - "--enable-prefix-caching"
            - "--download-dir=/models/hf"
          env:
            - {name: MODEL, value: Qwen/Qwen2.5-0.5B-Instruct}
            - {name: SERVED_NAME, value: qwen2.5-0.5b}
            - {name: HF_HOME, value: /models/hf}
            - name: HF_TOKEN
              valueFrom: {secretKeyRef: {name: hf-token, key: token}}
          ports: [{name: http, containerPort: 8000}]
          startupProbe:                # first start downloads weights: allow 30 min
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            failureThreshold: 4
          lifecycle:
            preStop:                   # leave the EndpointSlice before SIGTERM → no cut streams
              exec: {command: ["sleep", "15"]}
          resources:
            requests: {cpu: 1500m, memory: 12Gi, nvidia.com/gpu: "1"}
            limits: {memory: 32Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: model-cache}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llm-serving
  labels: {app: vllm}
spec:
  selector: {app: vllm}
  ports: [{name: http, port: 8000, targetPort: http}]
