# Serving INSIDE llms (Chapters 08, 11, 04): only the ingress controller (Traefik,
# namespace 'ingress' in this vCluster) and pods in llm-serving may connect.
# Prometheus runs on the ROOT, in a namespace this vCluster can't see; it is
# allowed by the root's CiliumNetworkPolicy vcluster-boundary
# (manifests/root/05-vclusters/cilium-policies.yaml), not here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-and-same-namespace, namespace: llm-serving}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress}
        - podSelector: {}
