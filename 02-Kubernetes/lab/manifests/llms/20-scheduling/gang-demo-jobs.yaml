# Two 3-pod "distributed" jobs that each need 3 GPU slices (Step 07 lab).
# spark-cq allows 4 slices: both together (6) don't fit, either alone does.
# Without Kueue: pods start one by one → each job can hold a partial gang (deadlock).
# With Kueue:    gang-a is admitted whole, gang-b waits whole, then runs.
apiVersion: batch/v1
kind: Job
metadata:
  name: gang-a
  namespace: batch
  labels:
    kueue.x-k8s.io/queue-name: train
    kueue.x-k8s.io/priority-class: routine
spec:
  suspend: true                     # Kueue un-suspends when the whole job fits
  parallelism: 3
  completions: 3
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      priorityClassName: spark-batch
      containers:
        - name: worker
          image: nvcr.io/nvidia/cuda:13.0.1-base-ubuntu24.04
          command: ["bash", "-c", "echo rank=$JOB_COMPLETION_INDEX; nvidia-smi -L; sleep 120"]
          resources:
            requests: {cpu: 500m, memory: 2Gi, nvidia.com/gpu: "1"}
            limits: {cpu: 500m, memory: 2Gi, nvidia.com/gpu: "1"}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gang-b
  namespace: batch
  labels:
    kueue.x-k8s.io/queue-name: train
    kueue.x-k8s.io/priority-class: routine
spec:
  suspend: true
  parallelism: 3
  completions: 3
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      priorityClassName: spark-batch
      containers:
        - name: worker
          image: nvcr.io/nvidia/cuda:13.0.1-base-ubuntu24.04
          command: ["bash", "-c", "echo rank=$JOB_COMPLETION_INDEX; nvidia-smi -L; sleep 120"]
          resources:
            requests: {cpu: 500m, memory: 2Gi, nvidia.com/gpu: "1"}
            limits: {cpu: 500m, memory: 2Gi, nvidia.com/gpu: "1"}
