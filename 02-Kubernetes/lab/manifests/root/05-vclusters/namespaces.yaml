# Host namespaces that hold the two vClusters (Chapter 04). Each vCluster's
# control plane AND every pod its tenants create really run here, renamed
# <pod>-x-<namespace>-x-<vcluster> by the syncer.
apiVersion: v1
kind: Namespace
metadata:
  name: vc-dev-lab
  labels:
    spark.lab/tier: vcluster
    spark.lab/vcluster: dev-lab
    # dev-lab runs tenants and lab tools only; node-level tools live in the
    # root's platform-tools namespace, so baseline is enough here.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: vc-dev-llms
  labels:
    spark.lab/tier: vcluster
    spark.lab/vcluster: dev-llms
    # dev-llms is a sandbox for LLM manifests and small models. Serving images
    # run as root and need /dev/shm, which baseline allows; anything that needs
    # more (hostNetwork NCCL, IPC_LOCK) belongs on the root, in batch.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
