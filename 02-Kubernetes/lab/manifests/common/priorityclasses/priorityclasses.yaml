# Who wins when the single Spark is full (Chapter 07).
# Order: platform > serving > interactive > batch > preemptible.
#
# The root and both vClusters create these same classes (this file is included
# by root/, dev-lab/ and llms/ 00-platform). vCluster copies a tenant's classes
# to the root with translated names, so ONE scheduler — the root's — compares pods from both
# vClusters and the platform. A pod at spark-serving in llms can preempt a
# spark-preemptible pod in dev-lab. That is the point of a shared GPU, and the
# reason tenants must not be allowed to create PriorityClasses (Chapter 07 §7).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: spark-platform}
value: 100000
description: "Platform add-ons that must keep running (monitoring, vCluster control planes, node probes)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: spark-serving}
value: 50000
description: "Online inference with an SLO."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: spark-interactive}
value: 20000
globalDefault: true
description: "Default: notebooks, dev pods."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: spark-batch}
value: 10000
preemptionPolicy: Never          # waits in queue, never evicts anyone
description: "Training / batch jobs admitted by Kueue."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: spark-preemptible}
value: 1000
preemptionPolicy: Never
description: "Best-effort experiments; first to be preempted."
