# Kueue on the ROOT cluster: quota-aware job queueing + all-or-nothing
# admission (Chapters 07, 04). Installed with scripts/install-addons.sh kueue;
# apply with --context spark-root.
#
#   ResourceFlavor  gb10          "what kind of capacity" (node labels)
#   ClusterQueue    spark-cq      "how much" — the batch share of the root: 2 CPU · 12 Gi · 3 slices
#   LocalQueue      batch/train   "where tenants submit" (namespace-scoped)
#
# Kueue admits a Job (on requests); then the batch namespace's ResourceQuota
# batch-budget (same numbers) admits its pods. CPU and slices are batch's own;
# its 12 Gi come out of the LLM memory pool it shares with serving
# (root-llms/10-tenancy/quotas.yaml), so an admitted job can still wait Pending
# while models fill the pool. Training waits for serving, never the reverse.
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: gb10
spec:
  nodeLabels:
    spark.lab/gpu: gb10
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: spark-cq
spec:
  namespaceSelector: {}                    # any namespace with a LocalQueue
  queueingStrategy: BestEffortFIFO         # small jobs may pass a blocked big one
  preemption:
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources: [cpu, memory, nvidia.com/gpu]
      flavors:
        - name: gb10
          resources:
            - name: cpu
              nominalQuota: "2"
            - name: memory
              nominalQuota: 12Gi
            - name: nvidia.com/gpu
              nominalQuota: "3"            # 3 of the root's 11 time-slices; serving keeps 6, the platform 2
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: train
  namespace: batch
spec:
  clusterQueue: spark-cq
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: WorkloadPriorityClass
metadata:
  name: urgent
value: 1000
description: "Deadline runs — may preempt lower-priority queued work in spark-cq"
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: WorkloadPriorityClass
metadata:
  name: routine
value: 100
