# Verify the secondary RDMA interface from inside a pod (Chapter 17 §5.6), on the
# ROOT in namespace batch. Multus looks up NetworkAttachmentDefinition cx7-rdma
# in the pod's own namespace — batch — which is where root/85-network-operator
# (and 01-Ansible playbook 21.1) put it.
apiVersion: v1
kind: Pod
metadata:
  name: rdma-test
  namespace: batch
  annotations:
    k8s.v1.cni.cncf.io/networks: cx7-rdma
spec:
  restartPolicy: Never
  containers:
    - name: t
      image: nvcr.io/nvidia/pytorch:25.09-py3
      command: ["bash", "-c", "ip -br addr; ibv_devices; ibv_devinfo -l; sleep 3600"]
      securityContext:
        capabilities: {add: [IPC_LOCK]}            # RDMA needs pinned memory
      resources:
        limits: {rdma/rdma_shared_cx7: "1", memory: 4Gi}
        requests: {cpu: 500m}
