# The LLM budgets on the ROOT cluster (Chapters 14, 20, 04).
#
#   allocatable to pods          17 CPU · ~109.7 GiB · 15 slices
#   vCluster dev-lab              2 CPU ·     4 Gi  ·  2 slices   (root/05-vclusters/quotas.yaml)
#   vCluster dev-llms             2 CPU ·     4 Gi  ·  2 slices   (root/05-vclusters/quotas.yaml)
#   root keeps                   13 CPU · ~101.7 GiB · 11 slices:
#     platform (no quota)         3 CPU ·  ~11.7 GiB ·  2 slices   Cilium, MetalLB, GPU Operator, Prometheus,
#                                                                 Traefik, Kueue, KEDA, platform-tools
#     LLM memory pool                     ~90 GiB                 shared by:
#       llm-serving (this file)   8 CPU · up to 90 Gi · 6 slices · 1 Ti    model servers
#       batch       (this file)   2 CPU · up to 12 Gi · 3 slices · 200 Gi  training (Kueue spark-cq, same numbers)
#
# CPU and slices are split (3 + 8 + 2 = 13, 2 + 6 + 3 = 11); only MEMORY is
# shared. Serving may use the whole pool while nothing trains; a training job
# takes up to 12 Gi of it. What stops the two from overcommitting unified
# memory is the scheduler: model servers and training pods set memory
# request = limit, so the node's allocatable memory is the real cap and a pod
# that doesn't fit waits Pending instead of squeezing a running model
# (tests/budget_check.py checks request = limit on every GPU container here).
#
# Model memory: ~90 GiB → keep the sum of vLLM --gpu-memory-utilization across
# models running at the same time ≲ 0.72 (util × ~121.7 GiB, with headroom).
# Example sets: three 7-8B models at 0.20 (16k context), one 32B FP8 model at
# 0.45 + one 7B at 0.25, or R1-Distill-32B BF16 at 0.70 alone (Chapter 20 §2).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: serving-budget
  namespace: llm-serving
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 90Gi
    limits.memory: 90Gi
    requests.nvidia.com/gpu: "6"
    requests.storage: 1Ti
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: batch-budget
  namespace: batch
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 12Gi
    limits.memory: 12Gi
    requests.nvidia.com/gpu: "3"
    requests.storage: 200Gi
