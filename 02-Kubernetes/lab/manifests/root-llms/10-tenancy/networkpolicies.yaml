# Serving on the root (Chapters 08, 11, 04): only the ingress controller
# (Traefik, namespace 'ingress'), Prometheus (namespace 'observability') and
# pods in llm-serving itself may connect. Everything else — including the two
# vClusters' pods in vc-dev-lab and vc-dev-llms — is dropped.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-and-same-namespace, namespace: llm-serving}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
        - podSelector: {}
