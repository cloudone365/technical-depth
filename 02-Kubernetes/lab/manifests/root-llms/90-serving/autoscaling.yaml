# Queue-depth autoscaling with KEDA on the ROOT cluster (Chapter 20 §8, Chapter 04).
# Scale on what users feel (requests waiting), not on GPU utilisation (a
# time-sliced GB10 reads ~100 % whenever anything runs).
# Install KEDA on the root: scripts/install-addons.sh keda
# KEDA queries the root's Prometheus directly (Service kps-prometheus in
# 'observability'). The model servers' metrics carry vcluster="root" and
# vnamespace labels (ServiceMonitor llm-workloads, root/95-observability).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: mock-llm, namespace: llm-serving}
spec:
  scaleTargetRef: {name: mock-llm}
  minReplicaCount: 1
  maxReplicaCount: 6
  cooldownPeriod: 120
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kps-prometheus.observability.svc:9090
        # in-flight requests on the Traefik service that fronts mock-llm
        query: sum(traefik_service_open_connections{vcluster="root", exported_service=~"llm-serving-mock-llm-8000@kubernetes"})
        threshold: "8"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: vllm, namespace: llm-serving}
spec:
  scaleTargetRef: {name: vllm}
  minReplicaCount: 1
  maxReplicaCount: 1                   # raise to 2 when dgx-spark-2 joins
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kps-prometheus.observability.svc:9090
        query: sum(vllm:num_requests_waiting{vcluster="root", vnamespace="llm-serving"})
        threshold: "16"
