# vLLM OpenAI-compatible server on one GB10 time-slice, on the ROOT cluster
# (Chapters 20, 04). Apply with --context spark-root.
#
# Two memory budgets, both must hold:
#   1. vLLM's own: --gpu-memory-utilization is a fraction of the ~121.7 GiB the
#      GPU reports — i.e. of the SAME memory the OS, Kubernetes and every other
#      pod use. 0.20 ≈ 24 GiB (weights + KV cache).
#   2. The namespace's: serving-budget allows 90 Gi for ALL model servers in
#      llm-serving (root-llms/10-tenancy/quotas.yaml), shared with batch. The
#      request equals the limit (32 Gi), so the scheduler counts what the engine
#      really holds; one more engine of this size still fits next to it and the
#      always-on helpers (Qdrant, mock LLM).
#      Whether CUDA memory
#      is charged to this limit is measured in Chapter 14 §5.5 — size as if it is.
#
# HF_TOKEN comes from Secret hf-token if it exists (optional). The base ships no
# Secret on purpose: a placeholder token would overwrite a real one on every
# apply, and the Hub rejects an invalid token even for public models. Create it
# only for gated models (Chapter 20 §5.1) or let vault-sync write it (03 Ch15).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm-serving
  labels: {app: vllm, model: qwen2-5-0-5b}
spec:
  replicas: 1
  strategy:
    type: Recreate                     # a 2nd copy during rollout would double UMA use
  selector: {matchLabels: {app: vllm}}
  template:
    metadata:
      labels: {app: vllm, model: qwen2-5-0-5b}
    spec:
      priorityClassName: spark-serving
      terminationGracePeriodSeconds: 120   # longer than the longest expected generation (Chapter 09 §5.6)
      enableServiceLinks: false   # Service 'vllm' would inject VLLM_PORT=tcp://… and vLLM refuses to start
      containers:
        - name: vllm
          image: nvcr.io/nvidia/vllm:25.09-py3
          command: ["vllm", "serve"]
          args:
            - "$(MODEL)"
            - "--served-model-name=$(SERVED_NAME)"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--gpu-memory-utilization=0.20"
            - "--max-model-len=8192"
            - "--max-num-seqs=64"
            - "--enable-prefix-caching"
            - "--download-dir=/models/hf"
          env:
            - {name: MODEL, value: Qwen/Qwen2.5-0.5B-Instruct}
            - {name: SERVED_NAME, value: qwen2.5-0.5b}
            - {name: HF_HOME, value: /models/hf}
            - name: HF_TOKEN
              valueFrom: {secretKeyRef: {name: hf-token, key: token, optional: true}}
            # last on purpose: 03/04 overlays patch env/0, env/1 and env/3 (HF_TOKEN) by index
            - {name: HF_HUB_CACHE, value: /models/hf}   # = hf download --cache-dir (model-prefetch)
          ports: [{name: http, containerPort: 8000}]
          startupProbe:                # first start downloads weights: allow 30 min
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            failureThreshold: 4
          lifecycle:
            # Drain before SIGTERM. vLLM aborts open requests on SIGTERM (measured on the
            # Spark: 5 streams cut at ~730 of 1500 tokens with a plain 'sleep 15'), so the
            # grace period alone saves nothing. Wait 5 s for the pod to leave the
            # EndpointSlice, then until vllm:num_requests_running + _waiting is 0, at most
            # 100 s more (terminationGracePeriodSeconds 120 covers preStop + shutdown).
            preStop:
              exec:
                command:
                  - python3
                  - -c
                  - |
                    import time, urllib.request
                    time.sleep(5)
                    for _ in range(100):
                        try:
                            m = urllib.request.urlopen("http://127.0.0.1:8000/metrics", timeout=2).read().decode()
                        except Exception:
                            break
                        n = sum(float(l.rsplit(" ", 1)[1]) for l in m.splitlines()
                                if l.startswith(("vllm:num_requests_running", "vllm:num_requests_waiting")))
                        if n == 0:
                            break
                        time.sleep(1)
          resources:
            requests: {cpu: 1500m, memory: 32Gi, nvidia.com/gpu: "1"}   # request = limit: the scheduler counts the real size
            limits: {memory: 32Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: model-cache}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llm-serving
  labels: {app: vllm}
spec:
  selector: {app: vllm}
  ports: [{name: http, port: 8000, targetPort: http}]
