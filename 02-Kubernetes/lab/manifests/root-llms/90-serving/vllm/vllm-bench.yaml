# Load test with vLLM's own benchmark client (Chapter 20 §5.5). Reports
# throughput, TTFT, TPOT/ITL percentiles for a fixed synthetic workload.
#   kubectl apply -f vllm-bench.yaml && kubectl -n llm-serving logs -f job/vllm-bench
apiVersion: batch/v1
kind: Job
metadata: {name: vllm-bench, namespace: llm-serving}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false   # Service 'vllm' would inject VLLM_PORT=tcp://… and vLLM refuses to start
      containers:
        - name: bench
          image: nvcr.io/nvidia/vllm:25.09-py3
          command: ["bash", "-c"]
          args:
            - |
              # /v1/completions ('--backend vllm'): with '--backend openai-chat' this release
              # answers the random-dataset prompts with 400 and the client waits 10 min for
              # "the endpoint to become up". Output is filtered: each pass is silent until it ends.
              for c in 1 8 32; do
                n=128
                echo "=== max-concurrency $c ($n prompts, $(date +%T))"
                vllm bench serve --backend vllm --endpoint /v1/completions \
                  --base-url http://vllm:8000 --model qwen2.5-0.5b --tokenizer "$MODEL" \
                  --dataset-name random --random-input-len 1024 --random-output-len 256 \
                  --num-prompts "$n" --max-concurrency "$c" --percentile-metrics ttft,tpot,itl,e2el \
                  2>&1 | grep -E 'throughput|TTFT|TPOT|ITL|E2EL|Successful'
              done
          env:
            - {name: MODEL, value: Qwen/Qwen2.5-0.5B-Instruct}
            - {name: HF_HOME, value: /models/hf}
            - {name: HF_HUB_CACHE, value: /models/hf}   # = hf download --cache-dir (model-prefetch)
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {memory: 1536Mi}}   # fits next to vLLM (32Gi) + Qdrant (2Gi) in serving-budget (90Gi)
          volumeMounts: [{name: models, mountPath: /models, readOnly: true}]
      volumes:
        - {name: models, persistentVolumeClaim: {claimName: model-cache, readOnly: true}}
