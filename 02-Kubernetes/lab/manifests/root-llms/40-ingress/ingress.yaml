# Classic Ingress → mock-llm with streaming-safe settings (Chapter 11).
# Test: curl -N http://llm.lab.local/v1/chat/completions ... (see Chapter 11).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm
  namespace: llm-serving
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # No llm-body-limit here: Traefik's buffering middleware holds the whole
    # response too (measured: TTFB = total), which kills token streaming.
    # Chapter 11 §5.5 adds it for one test and shows that trade-off.
    traefik.ingress.kubernetes.io/router.middlewares: llm-serving-llm-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: llm.lab.local
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service: {name: mock-llm, port: {number: 8000}}
          - path: /health
            pathType: Exact
            backend:
              service: {name: mock-llm, port: {number: 8000}}
