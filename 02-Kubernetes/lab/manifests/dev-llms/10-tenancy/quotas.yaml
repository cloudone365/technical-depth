# Sandbox budget INSIDE vCluster #2 · dev-llms (Chapters 14, 04).
#
#   root   vc-dev-llms   2 CPU · 4 Gi · 2 GPU slices · 200 Gi   ← the real cap (manifests/root/05-vclusters)
#   here   llm-sandbox   1500m · 3 Gi · 2 slices · 150 Gi        ← ceiling for experiments
#   rest   ≈ 0.5 CPU · 1 Gi for the vCluster control plane and CoreDNS
#
# Enough for the mock LLM, a tokenizer job or one tiny model (≈0.5B at
# --gpu-memory-utilization 0.02, ~2.5 GiB). Real models run on the root
# (manifests/root-llms, serving-budget 90 Gi).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-budget
  namespace: llm-sandbox
spec:
  hard:
    requests.cpu: 1500m
    requests.memory: 3Gi
    limits.memory: 3Gi
    requests.nvidia.com/gpu: "2"
    requests.storage: 150Gi
    persistentvolumeclaims: "5"
    pods: "20"
    services.loadbalancers: "0"
    services.nodeports: "0"
