# Helm values for kube-prometheus-stack on the ROOT cluster (Chapters 17, 26).
# Prometheus Operator + Prometheus + Alertmanager + Grafana, sized for one Spark:
# 15d retention, 50Gi on local NVMe. Installed by scripts/install-addons.sh kps:
#   helm upgrade --install kps prometheus-community/kube-prometheus-stack \
#     --version "$KPS_CHART_VERSION" -n observability -f addons/kube-prometheus-stack-values.yaml
#
# One Prometheus watches everything: the root control plane, the node, and —
# through manifests/root/95-observability/vcluster-workloads.yaml — the model
# servers inside the llms vCluster.
fullnameOverride: kps
crds:
  enabled: true
defaultRules:
  rules:
    etcd: true
    kubeProxy: true
# kubeadm runs etcd, controller-manager and scheduler as static pods labelled
# component=<name>; the chart's default Service selectors find them. The 01
# Ansible kubeadm config exposes the metrics on the node IP:
kubeEtcd:
  enabled: true
  service:
    port: 2381                  # listen-metrics-urls=http://0.0.0.0:2381 (plain HTTP)
    targetPort: 2381
  serviceMonitor:
    scheme: http
kubeControllerManager:
  service: {port: 10257, targetPort: 10257}
  serviceMonitor: {https: true, insecureSkipVerify: true}
kubeScheduler:
  service: {port: 10259, targetPort: 10259}
  serviceMonitor: {https: true, insecureSkipVerify: true}
kubeProxy:
  enabled: true                 # kube-proxy (iptables) metricsBindAddress 0.0.0.0:10249
# The 01-Ansible lab already runs prometheus-node-exporter on the host
# (:9100, with the GPU/UMA textfile collector). Don't start a second one;
# manifests/root/95-observability/host-exporters.yaml scrapes the existing one.
nodeExporter:
  enabled: false
prometheus:
  prometheusSpec:
    priorityClassName: spark-platform
    retention: 15d
    retentionSize: 40GB
    # pick up every ServiceMonitor/PodMonitor/Rule labelled release=kps
    serviceMonitorSelector:
      matchLabels: {release: kps}
    podMonitorSelector:
      matchLabels: {release: kps}
    ruleSelector:
      matchLabels: {release: kps}
    resources:
      requests: {cpu: 500m, memory: 2Gi}
      limits: {memory: 6Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-nvme
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 50Gi}}
alertmanager:
  alertmanagerSpec:
    priorityClassName: spark-platform
    resources: {limits: {memory: 256Mi}}
grafana:
  adminPassword: change-me      # replace from Vault (01-Ansible Chapter 18)
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  service:
    type: NodePort
    nodePort: 32000             # http://192.168.0.100:32000
