# Helm values for Traefik v3 on the ROOT cluster (Chapters 11, 04): the API
# gateway of the LLM stack — Ingress + Gateway API + Traefik CRDs.
# Installed by scripts/install-addons.sh traefik:
#   helm --kube-context spark-root upgrade --install traefik-lab traefik/traefik \
#     --version "$TRAEFIK_CHART_VERSION" -n ingress -f addons/traefik-values.yaml
#
# The model servers run in the root's llm-serving namespace, so Traefik runs
# next to them and reads Middlewares, IngressRoutes and Ingresses with their
# real names. It watches only the LLM namespaces: the vClusters' host
# namespaces (vc-*) hold translated objects that are not its business.
#
# MetalLB gives its LoadBalancer Service 192.168.0.115.
deployment:
  replicas: 1
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
    namespaces: [llm-serving, ingress]
  kubernetesIngress:
    enabled: true
    namespaces: [llm-serving, ingress]
    publishedService:
      enabled: true
  kubernetesGateway:
    enabled: true
gateway:
  enabled: true
  name: lab-gateway
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy: All
ports:
  web:
    # LLM streams can run for minutes; the defaults (readTimeout 60s)
    # cut long generations. 0s = no limit on the entrypoint; limit
    # per-route with a Middleware instead.
    transport:
      respondingTimeouts:
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 600s
  websecure:
    transport:
      respondingTimeouts:
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 600s
service:
  type: LoadBalancer
  annotations:
    metallb.io/loadBalancerIPs: 192.168.0.115
metrics:
  prometheus:
    # A plain metrics Service (traefik-lab-metrics); the ServiceMonitor
    # llm-workloads (root/95-observability) scrapes it with the same labels
    # as the model servers.
    service:
      enabled: true
    serviceMonitor:
      enabled: false
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 512Mi}
