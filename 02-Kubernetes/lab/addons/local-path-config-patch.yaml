# Merge-patch for local-path-provisioner's ConfigMap (Step 13): root every
# volume at /data/k8s on the NVMe instead of /opt/local-path-provisioner.
# Applied by scripts/install-addons.sh storage (and the 01-Ansible vclusters
# role) with:  kubectl -n local-path-storage patch configmap local-path-config \
#                --type merge --patch-file addons/local-path-config-patch.yaml
# A merge-patch, not an apply: the ConfigMap also holds the setup/teardown
# scripts the provisioner needs, and an apply of only this key would drop them.
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/data/k8s"]
        }
      ]
    }
