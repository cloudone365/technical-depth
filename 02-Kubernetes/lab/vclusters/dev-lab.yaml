# vCluster #1 · dev-lab — Helm values for chart loft/vcluster 0.37.x (Chapter 04).
# Installed into host namespace vc-dev-lab by 01-Ansible playbooks/20.2-vclusters.yml
# or scripts/install-addons.sh vclusters.
#
# Budget (enforced by the ROOT ResourceQuota in manifests/root/05-vclusters/quotas.yaml):
#   2 CPU (requests) · 8 Gi memory (requests = limits) · 2 GPU time-slices · 200 Gi storage
# Everything below — this control plane, CoreDNS, every tenant pod — counts against it.
#
# Inside: tenant-alpha, tenant-beta, lab-tools (manifests/dev-lab).
controlPlane:
  distro:
    k8s:
      enabled: true            # standard Kubernetes API server + controller-manager (vCluster ≥ 0.33 has no K3s)
  backingStore:
    database:
      embedded:
        enabled: true          # SQLite in the control-plane pod's volume — no etcd to run
  statefulSet:
    scheduling:
      priorityClassName: spark-platform   # tenants can't preempt their own control plane
    resources:
      requests: {cpu: 200m, memory: 512Mi, ephemeral-storage: 1Gi}
      limits: {memory: 1Gi, ephemeral-storage: 4Gi}
    persistence:
      volumeClaim:
        size: 5Gi
        storageClass: local-nvme
  # The virtual API server gets its own IP on the mgmt LAN (MetalLB pool .110–.119).
  service:
    annotations:
      metallb.io/loadBalancerIPs: 192.168.0.111
    spec:
      type: LoadBalancer
  proxy:
    extraSANs: [192.168.0.111]

# Writes Secret vc-dev-lab (key 'config') with a kubeconfig that points at the LB IP.
exportKubeConfig:
  context: dev-lab
  server: https://192.168.0.111:443

sync:
  toHost:
    # pods, services, endpoints, PVCs, ConfigMaps, Secrets are synced by default
    networkPolicies:
      enabled: true            # tenant NetworkPolicies become real (translated) policies Cilium enforces
    priorityClasses:
      enabled: true            # tenant PriorityClasses are copied to the root so its scheduler can use them
    podDisruptionBudgets:
      enabled: true            # a root 'kubectl drain' must respect tenant PDBs (break/fix 11)
  fromHost:
    nodes:
      enabled: true            # show the real Spark node(s): labels, allocatable GPUs, taints
      selector:
        all: true
      clearImageStatus: true
    storageClasses:
      enabled: true            # local-path, local-nvme, local-nvme-retain are visible (read-only)

integrations:
  metricsServer:
    enabled: true              # 'kubectl top' and HPAs inside the vCluster read the root's metrics-server
