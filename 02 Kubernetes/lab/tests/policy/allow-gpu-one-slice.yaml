# expect: allow
# cluster: dev-lab
# one time-slice inside the tenant budget (dev-lab: 1 of the vCluster's 2)
apiVersion: v1
kind: Pod
metadata: {name: pt-allow-gpu-one-slice, namespace: tenant-alpha}
spec:
  securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: c
      image: nvcr.io/nvidia/cuda:13.0.1-base-ubuntu24.04
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      resources: {limits: {nvidia.com/gpu: "1", cpu: 200m, memory: 256Mi}}
