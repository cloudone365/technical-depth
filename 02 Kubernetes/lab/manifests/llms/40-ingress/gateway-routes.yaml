# The same API through Gateway API (Volume 09). The Traefik chart creates
# Gateway 'lab-gateway' in namespace 'ingress' (addons/traefik-values.yaml).
# Weighted backends = canary: 90 % to stable, 10 % to canary.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-gw
  namespace: llm-serving
spec:
  parentRefs:
    - name: lab-gateway
      namespace: ingress
  hostnames: ["gw.lab.local"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1}
      timeouts:
        request: 600s                  # a whole long generation
      backendRefs:
        - {name: mock-llm, port: 8000, weight: 90}
        - {name: mock-llm-canary, port: 8000, weight: 10}
---
apiVersion: v1
kind: Service
metadata: {name: mock-llm-canary, namespace: llm-serving}
spec:
  selector: {app: mock-llm-canary}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mock-llm-canary, namespace: llm-serving}
spec:
  replicas: 1
  selector: {matchLabels: {app: mock-llm-canary}}
  template:
    metadata: {labels: {app: mock-llm-canary}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: python:3.12-slim
          command: ["python3", "/app/mock_llm.py"]
          env: [{name: MODEL_NAME, value: mock-llm-canary}]
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 2}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes:
        - name: app
          configMap: {name: mock-llm-app}
