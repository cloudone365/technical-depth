# Mock OpenAI endpoint in llm-serving (Step 11). The script lives in a
# ConfigMap generated by kustomize from mock_llm.py.
apiVersion: apps/v1
kind: Deployment
metadata: {name: mock-llm, namespace: llm-serving, labels: {app: mock-llm}}
spec:
  replicas: 2
  selector: {matchLabels: {app: mock-llm}}
  template:
    metadata: {labels: {app: mock-llm}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: python:3.12-slim
          command: ["python3", "/app/mock_llm.py"]
          env:
            - {name: TOKENS_PER_SEC, value: "20"}
            - {name: STARTUP_DELAY, value: "5"}
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 30}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes:
        - name: app
          configMap: {name: mock-llm-app}
---
apiVersion: v1
kind: Service
metadata: {name: mock-llm, namespace: llm-serving}
spec:
  selector: {app: mock-llm}
  ports: [{name: http, port: 8000, targetPort: http}]
