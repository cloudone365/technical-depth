# Vector DB as a StatefulSet (Volume 10), INSIDE vCluster #2 · llms: stable name
# qdrant-0, stable DNS qdrant-0.qdrant-headless.llm-serving.svc (in the vCluster's
# DNS), and a PVC that follows the pod (synced to the root as a real local-nvme PV).
apiVersion: v1
kind: Service
metadata: {name: qdrant-headless, namespace: llm-serving}
spec:
  clusterIP: None
  publishNotReadyAddresses: true       # peers must find each other while starting
  selector: {app: qdrant}
  ports:
    - {name: http, port: 6333}
    - {name: grpc, port: 6334}
    - {name: p2p, port: 6335}
---
apiVersion: v1
kind: Service
metadata: {name: qdrant, namespace: llm-serving}
spec:
  selector: {app: qdrant}
  ports:
    - {name: http, port: 6333}
    - {name: grpc, port: 6334}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: qdrant, namespace: llm-serving}
spec:
  serviceName: qdrant-headless
  replicas: 1                          # 3 when you have 3 nodes; see Volume 10 §8
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {partition: 0}      # raise to canary a new version on the highest ordinal only
  selector: {matchLabels: {app: qdrant}}
  template:
    metadata: {labels: {app: qdrant}}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 60
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.13.4-unprivileged
          ports:
            - {name: http, containerPort: 6333}
            - {name: grpc, containerPort: 6334}
            - {name: p2p, containerPort: 6335}
          env:
            - {name: QDRANT__STORAGE__STORAGE_PATH, value: /qdrant/storage}
            - {name: QDRANT__STORAGE__SNAPSHOTS_PATH, value: /qdrant/snapshots}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /livez, port: http}, initialDelaySeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /qdrant/storage}
            - {name: snapshots, mountPath: /qdrant/snapshots}
      volumes:
        - name: snapshots
          emptyDir: {sizeLimit: 10Gi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        storageClassName: local-nvme-retain
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 20Gi}}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: qdrant, namespace: llm-serving}
spec:
  maxUnavailable: 0                    # single replica: `kubectl drain` must stop and ask (Volume 10 §5)
  selector: {matchLabels: {app: qdrant}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: mock-llm, namespace: llm-serving}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: mock-llm}}
