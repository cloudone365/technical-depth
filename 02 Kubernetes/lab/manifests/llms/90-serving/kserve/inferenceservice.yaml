# KServe in RawDeployment mode INSIDE vCluster #2 · llms (Volume 23, 27).
# Scale deploy/vllm to 0 first (llms memory budget). No Knative, no Istio — KServe
# creates a plain Deployment + Service + HPA. Requires cert-manager and the
# KServe controller (scripts/install-addons.sh kserve).
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata: {name: vllm-spark, namespace: llm-serving}
spec:
  supportedModelFormats:
    - {name: huggingface, version: "1", autoSelect: true}
  containers:
    - name: kserve-container
      image: nvcr.io/nvidia/vllm:25.09-py3
      command: ["vllm", "serve", "/mnt/models"]          # storage-initializer downloads storageUri here
      args: ["--served-model-name={{.Name}}", "--port=8080",
             "--gpu-memory-utilization=0.20", "--max-model-len=8192"]
      ports: [{containerPort: 8080, protocol: TCP}]
      resources:
        requests: {cpu: 1500m, memory: 12Gi, nvidia.com/gpu: "1"}
        limits: {memory: 32Gi, nvidia.com/gpu: "1"}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-small
  namespace: llm-serving
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/autoscalerClass: hpa
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1                     # one GB10: scale-out comes with spark-02
    model:
      modelFormat: {name: huggingface}
      runtime: vllm-spark
      storageUri: hf://Qwen/Qwen2.5-0.5B-Instruct
