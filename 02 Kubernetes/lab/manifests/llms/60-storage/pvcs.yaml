# Model cache shared by the serving steps (Steps 13, 20). Retain: deleting
# the PVC never deletes 60 GB of downloaded weights.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: model-cache, namespace: llm-serving}
spec:
  storageClassName: local-nvme-retain
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 300Gi}}   # fits serving-budget (400Gi) next to Qdrant, and vc-llms (500Gi)
