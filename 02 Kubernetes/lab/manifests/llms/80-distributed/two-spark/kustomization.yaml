# Two Sparks over the CX-7 QSFP link (Volume 17 §3.3, §5.5). Host networking lets NCCL
# see the RoCE devices directly; the pod anti-affinity puts one rank per Spark.
# Interface/HCA names are from 01 Ansible host_vars — confirm with `ibdev2netdev`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../base]
patches:
  - target: {kind: Job, name: ddp}
    patch: |-
      - op: add
        path: /spec/template/spec/hostNetwork
        value: true
      - op: add
        path: /spec/template/spec/dnsPolicy
        value: ClusterFirstWithHostNet
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {job-name: ddp}}
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - {name: BACKEND, value: nccl}
          - {name: NCCL_DEBUG, value: INFO}
          - {name: NCCL_SOCKET_IFNAME, value: enp1s0f1np1}
          - {name: NCCL_IB_HCA, value: "rocep1s0f1,roceP2p1s0f1"}
          - {name: NCCL_IB_GID_INDEX, value: "3"}
          - {name: TORCH_NCCL_ASYNC_ERROR_HANDLING, value: "1"}
