# 2-rank torchrun job without any operator (Volume 17): Indexed Job + headless
# Service gives each pod a stable DNS name: ddp-0.ddp-workers.batch.svc
# Rank 0 is the rendezvous master. One Spark → BACKEND=gloo (see script docstring).
apiVersion: v1
kind: Service
metadata: {name: ddp-workers, namespace: batch}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {job-name: ddp}
  ports: [{name: rdzv, port: 29500}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ddp
  namespace: batch
  labels:
    kueue.x-k8s.io/queue-name: train          # gang-admitted: both ranks or none
spec:
  suspend: true
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  template:
    spec:
      subdomain: ddp-workers
      restartPolicy: Never
      priorityClassName: spark-batch
      containers:
        - name: trainer
          image: nvcr.io/nvidia/pytorch:25.09-py3
          command: ["bash", "-c"]
          args:
            - >-
              torchrun --nnodes=2 --nproc-per-node=1
              --node-rank=${JOB_COMPLETION_INDEX}
              --master-addr=ddp-0.ddp-workers.batch.svc.cluster.local --master-port=29500
              /bench/allreduce_bench.py
          env:
            - {name: BACKEND, value: gloo}
            - {name: NCCL_DEBUG, value: WARN}
            - {name: TORCH_NCCL_ASYNC_ERROR_HANDLING, value: "1"}
          ports: [{containerPort: 29500}]
          resources:
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: bench, mountPath: /bench}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: bench
          configMap: {name: allreduce-bench}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
