# Smallest possible proof that scheduling + device plugin + runtime work (Volume 14, 16).
apiVersion: v1
kind: Pod
metadata: {name: gpu-smoke, namespace: tenant-beta}
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: smi
      image: nvcr.io/nvidia/cuda:13.0.1-base-ubuntu24.04
      command: ["bash", "-c", "nvidia-smi -L && nvidia-smi --query-gpu=name,compute_cap,driver_version,memory.total --format=csv"]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      resources:
        limits: {nvidia.com/gpu: "1", cpu: 100m, memory: 128Mi}
