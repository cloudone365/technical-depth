# Who wins when the single Spark is full (Volume 05).
# Order: platform > serving > interactive > batch > preemptible.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: spark-platform}
value: 100000
description: "Cluster add-ons that must keep running (ingress, monitoring)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: spark-serving}
value: 50000
description: "Online inference with an SLO."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: spark-interactive}
value: 20000
globalDefault: true
description: "Default: notebooks, dev pods."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: spark-batch}
value: 10000
preemptionPolicy: Never          # waits in queue, never evicts anyone
description: "Training / batch jobs admitted by Kueue."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: spark-preemptible}
value: 1000
preemptionPolicy: Never
description: "Best-effort experiments; first to be preempted."
