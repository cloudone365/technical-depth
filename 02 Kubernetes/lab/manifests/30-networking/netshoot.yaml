# Network toolbox (Volume 06-08). Two flavours:
#   netshoot      — inside the pod network (what a workload sees)
#   netshoot-host — hostNetwork + NET_ADMIN (what the node sees: veth, iptables, conntrack)
apiVersion: apps/v1
kind: Deployment
metadata: {name: netshoot, namespace: lab-tools}
spec:
  replicas: 1
  selector: {matchLabels: {app: netshoot}}
  template:
    metadata: {labels: {app: netshoot}}
    spec:
      containers:
        - name: netshoot
          image: nicolaka/netshoot:v0.13
          command: ["sleep", "infinity"]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 256Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: netshoot-host, namespace: lab-tools}
spec:
  replicas: 1
  selector: {matchLabels: {app: netshoot-host}}
  template:
    metadata: {labels: {app: netshoot-host}}
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: netshoot
          image: nicolaka/netshoot:v0.13
          command: ["sleep", "infinity"]
          securityContext:
            capabilities: {add: [NET_ADMIN, NET_RAW, SYS_ADMIN, SYS_PTRACE]}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 256Mi}}
