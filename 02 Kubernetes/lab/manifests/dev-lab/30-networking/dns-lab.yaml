# ndots experiment (Step 10), INSIDE dev-lab: same lookup, two resolver configs.
# The resolver here is dev-lab's own CoreDNS (search path *.svc.cluster.local
# of the vCluster), so the amplification you measure is a tenant's view.
# 'dns-default' inherits ndots:5 → "api.openai.com" is tried against the 3 cluster search
# domains (+ the node's own, if any) first (6+ wasted queries: A+AAAA each). 'dns-ndots1' goes straight out.
apiVersion: v1
kind: Pod
metadata: {name: dns-default, namespace: lab-tools, labels: {app: dns-lab}}
spec:
  containers:
    - name: t
      image: nicolaka/netshoot:v0.13
      command: ["sleep", "infinity"]
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 128Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: dns-ndots1, namespace: lab-tools, labels: {app: dns-lab}}
spec:
  dnsConfig:
    options:
      - {name: ndots, value: "1"}
      - {name: single-request-reopen}
  containers:
    - name: t
      image: nicolaka/netshoot:v0.13
      command: ["sleep", "infinity"]
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 128Mi}}
