apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [gemm-bench.yaml]          # gemm-solo and compile-compare are one-off runs
configMapGenerator:
  - name: gemm-bench
    namespace: platform-tools
    files: [gemm_bench.py, compile_compare.py]
generatorOptions:
  disableNameSuffixHash: true
