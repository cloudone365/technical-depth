# Priority & preemption on the root (Volume 05 §5.3). Runs in the root's
# platform-tools namespace (--context spark-root) because preemption needs the
# NODE to be full; inside a vCluster the root quota refuses pods long before.
# 1) filler: scale to the free slices so preemptible pods take every one left
#      free=$(( $(kubectl get node dgx-spark-01 -o jsonpath='{.status.allocatable.nvidia\.com/gpu}') \
#               - $(kubectl get pods -A -o json | jq '[.items[] | select(.status.phase=="Running") | .spec.containers[].resources.limits["nvidia.com/gpu"] // "0" | tonumber] | add') ))
#      kubectl -n platform-tools scale deploy filler --replicas=$free
# 2) urgent: one serving-priority pod arrives → the scheduler evicts one filler
apiVersion: apps/v1
kind: Deployment
metadata: {name: filler, namespace: platform-tools}
spec:
  replicas: 5                       # the root's own 5 slices when the vClusters' GPUs are busy; scale as above
  selector: {matchLabels: {app: filler}}
  template:
    metadata: {labels: {app: filler}}
    spec:
      priorityClassName: spark-preemptible
      terminationGracePeriodSeconds: 5
      containers:
        - name: sleep
          image: nvcr.io/nvidia/cuda:13.0.1-base-ubuntu24.04
          command: ["sleep", "infinity"]
          resources: {limits: {nvidia.com/gpu: "1", memory: 64Mi}, requests: {cpu: 10m}}
---
apiVersion: v1
kind: Pod
metadata: {name: urgent, namespace: platform-tools}
spec:
  priorityClassName: spark-serving
  containers:
    - name: sleep
      image: nvcr.io/nvidia/cuda:13.0.1-base-ubuntu24.04
      command: ["sleep", "infinity"]
      resources: {limits: {nvidia.com/gpu: "1", memory: 64Mi}, requests: {cpu: 10m}}
