# THE question for a UMA box (Volume 12 §5.5): is a CUDA allocation charged to
# the pod's memory cgroup? Memory limit 4 Gi, GPU allocation 16 GiB.
# Runs on the ROOT (platform-tools). The answer decides how the vCluster memory
# budgets in root/05-vclusters/quotas.yaml must be read: if CUDA memory is NOT
# charged, a vCluster's 48 Gi does not cap what its model servers put on the GPU.
#  - If it OOMKills at ~4 Gi   → CUDA memory IS charged: pod limits protect the node.
#  - If it holds 16 GiB happily → it is NOT charged: only engine flags
#    (--gpu-memory-utilization, --mem-fraction-static) and node-level alerts protect you.
# Record your result (it can change with driver/DGX OS releases).
apiVersion: v1
kind: Pod
metadata: {name: uma-cgroup-experiment, namespace: platform-tools}
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: nvcr.io/nvidia/pytorch:25.09-py3
      command: ["python3", "-c"]
      args:
        - |
          import time, torch
          def cg():
              return int(open('/sys/fs/cgroup/memory.current').read()) / 2**30
          print(f"start: cgroup memory.current={cg():.2f} GiB", flush=True)
          x = torch.empty(int(16 * 2**30), dtype=torch.uint8, device="cuda")
          x.fill_(1); torch.cuda.synchronize()
          free, total = torch.cuda.mem_get_info()
          print(f"allocated 16 GiB on GPU: cgroup memory.current={cg():.2f} GiB, "
                f"torch free={free/2**30:.1f}/{total/2**30:.1f} GiB", flush=True)
          time.sleep(30)
          print("survived", flush=True)
      resources:
        requests: {cpu: "1", memory: 4Gi}
        limits: {memory: 4Gi, nvidia.com/gpu: "1"}
