# Host namespaces that hold the two vClusters (Step 04). Each vCluster's
# control plane AND every pod its tenants create really run here, renamed
# <pod>-x-<namespace>-x-<vcluster> by the syncer.
apiVersion: v1
kind: Namespace
metadata:
  name: vc-dev-lab
  labels:
    spark.lab/tier: vcluster
    spark.lab/vcluster: dev-lab
    # dev-lab runs tenants and lab tools only; node-level tools live in the
    # root's platform-tools namespace, so baseline is enough here.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: vc-llms
  labels:
    spark.lab/tier: vcluster
    spark.lab/vcluster: llms
    # Multi-node NCCL in the llms 'batch' namespace needs hostNetwork/IPC_LOCK
    # (Step 18). Enforce privileged, warn at baseline so it stays visible.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
