# Root-side home of the two vClusters (Volume 27). Apply BEFORE installing the
# vCluster Helm charts (vclusters/*.yaml): the namespaces must exist and the
# quotas must be in place before the first pod is created.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - limitranges.yaml
  - quotas.yaml
  - cilium-policies.yaml
