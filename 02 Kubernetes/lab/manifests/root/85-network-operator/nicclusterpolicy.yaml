# NVIDIA Network Operator for 2 Sparks (Volume 16 §5.6, Volume 17) — OPTIONAL.
# DGX OS already ships the DOCA/MLNX host driver, so the operator must NOT
# install one (no ofedDriver section). It adds:
#   - RDMA shared device plugin → resource rdma/rdma_shared_cx7 on each Spark
#   - Multus + CNI plugins + whereabouts IPAM → a 2nd pod interface on the CX-7
# Install the operator itself first (Helm chart network-operator, see volume).
# The 01 Ansible lab (playbooks/13-multus-rdma.yml) is a lighter alternative:
# use ONE of the two, not both.
apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: nic-cluster-policy
spec:
  rdmaSharedDevicePlugin:
    image: k8s-rdma-shared-dev-plugin
    repository: ghcr.io/mellanox
    version: v1.5.3
    config: |
      {
        "configList": [
          {
            "resourceName": "rdma_shared_cx7",
            "rdmaHcaMax": 16,
            "selectors": {"ifNames": ["enp1s0f1np1", "enP2p1s0f1np1"]}
          }
        ]
      }
  secondaryNetwork:
    cniPlugins:
      image: plugins
      repository: ghcr.io/k8snetworkplumbingwg
      version: v1.6.2-update.1
    multus:
      image: multus-cni
      repository: ghcr.io/k8snetworkplumbingwg
      version: v4.1.0
    ipamPlugin:
      image: whereabouts
      repository: ghcr.io/k8snetworkplumbingwg
      version: v0.7.0
---
# Pods that request rdma/rdma_shared_cx7 and this network get net1 on the CX-7
# (macvlan on the first logical port). Range avoids the hosts' .11/.12.
apiVersion: mellanox.com/v1alpha1
kind: MacvlanNetwork
metadata:
  name: cx7-rdma
spec:
  networkNamespace: vc-llms             # root namespace where the llms vCluster's batch pods really run
  master: enp1s0f1np1
  mode: bridge
  mtu: 9000
  ipam: |
    {
      "type": "whereabouts",
      "range": "192.168.100.0/24",
      "range_start": "192.168.100.100",
      "range_end": "192.168.100.199"
    }
