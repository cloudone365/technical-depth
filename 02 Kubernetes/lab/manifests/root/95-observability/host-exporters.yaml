# Scrape exporters that run on the Spark host, outside Kubernetes (Volume 16):
#   :9100  prometheus-node-exporter + textfile GPU/UMA/CX-7 metrics (01 Ansible Step 12)
#   :9400  dcgm-exporter, only if enabled (see addons/dcgm-exporter-values.md)
# A selector-less Service + EndpointSlice points at the node IPs.
apiVersion: v1
kind: Service
metadata:
  name: spark-host-exporters
  namespace: observability
  labels: {app: spark-host-exporters}
spec:
  clusterIP: None
  ports:
    - {name: node, port: 9100}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: spark-host-exporters-1
  namespace: observability
  labels:
    kubernetes.io/service-name: spark-host-exporters
addressType: IPv4
ports:
  - {name: node, port: 9100, protocol: TCP}
endpoints:
  - addresses: ["192.168.0.100"]
    nodeName: dgx-spark-1
  # - addresses: ["192.168.0.101"]      # uncomment when dgx-spark-2 joins
  #   nodeName: dgx-spark-2
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spark-host-exporters
  namespace: observability
  labels: {release: kps}
spec:
  selector: {matchLabels: {app: spark-host-exporters}}
  endpoints:
    - port: node
      interval: 15s
      relabelings:
        - {sourceLabels: [__meta_kubernetes_endpoint_node_name], targetLabel: node}
