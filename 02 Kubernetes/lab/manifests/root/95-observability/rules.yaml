# Alerts that matter on a single DGX Spark running Kubernetes (Volume 16, 19, 27).
# Evaluated by the root's Prometheus: it sees the root quotas of the two vClusters
# (vc-dev-lab, vc-llms) and the synced pods, labelled vcluster/vnamespace by
# vcluster-workloads.yaml. Quotas INSIDE a vCluster are not visible here.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: spark-k8s
  namespace: observability
  labels: {release: kps}
spec:
  groups:
    - name: spark-uma
      rules:
        - alert: SparkUMAPressure
          # CPU + GPU share this pool: when it runs low, CUDA allocs fail AND pods get evicted
          expr: node_memory_MemAvailable_bytes{job="spark-host-exporters"} / node_memory_MemTotal_bytes{job="spark-host-exporters"} < 0.10
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.node }}: <10 % unified memory available"
            runbook: "https://github.com/cloudone365/technical-depth/blob/main/02%20Kubernetes/19-cluster-diagnostics-and-failure-scenarios.md#37-unified-memory-pressure-the-spark-specific-one"
        - alert: SparkNodeMemoryPressureCondition
          expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: "{{ $labels.node }} reports MemoryPressure — kubelet is evicting pods"
    - name: spark-tenancy
      rules:
        - alert: VClusterQuotaNearlyExhausted
          # the root budget of a whole vCluster (manifests/root/05-vclusters/quotas.yaml)
          expr: |
            kube_resourcequota{namespace=~"vc-.*", type="used"}
              / ignoring(type) kube_resourcequota{namespace=~"vc-.*", type="hard"} > 0.9
          for: 10m
          labels: {severity: info}
          annotations:
            summary: "vCluster {{ $labels.namespace }} uses >90 % of its {{ $labels.resource }} budget — new pods will stay Pending inside it"
        - alert: PodsPendingOnGPU
          expr: sum by (namespace) (kube_pod_status_phase{phase="Pending"} * on(namespace, pod) group_left() (kube_pod_container_resource_requests{resource="nvidia_com_gpu"} > 0)) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            # Only pods that exist on the root: a pod the root quota refused never gets here —
            # it waits inside its vCluster with a sync error (break/fix 02).
            summary: "GPU pods pending >10 min in {{ $labels.namespace }} (all time-slices taken?)"
    - name: spark-serving
      rules:
        - alert: VLLMQueueBacklog
          expr: sum by (vcluster, vnamespace) (vllm:num_requests_waiting) > 32
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "vLLM has >32 requests waiting — saturated KV cache or GPU"
        - alert: VLLMKVCacheFull
          # vllm:kv_cache_usage_perc (current) or vllm:gpu_cache_usage_perc (older releases)
          expr: max by (vcluster, vnamespace, vpod) (vllm:kv_cache_usage_perc or vllm:gpu_cache_usage_perc) > 0.95
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.vcluster }}/{{ $labels.vpod }} KV cache >95 % — requests are being preempted/recomputed"
        - record: spark:vllm_ttft_p95_seconds
          expr: histogram_quantile(0.95, sum by (le, vcluster, vnamespace) (rate(vllm:time_to_first_token_seconds_bucket[5m])))
        - record: spark:vllm_tpot_p95_seconds
          # inter_token_latency (current name) or time_per_output_token (older releases)
          expr: histogram_quantile(0.95, sum by (le, vcluster, vnamespace) (rate(vllm:inter_token_latency_seconds_bucket[5m]) or rate(vllm:time_per_output_token_seconds_bucket[5m])))
    - name: spark-control-plane
      rules:
        - alert: EtcdSlowFsync
          expr: histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])) > 0.05
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "etcd WAL fsync p99 > 50 ms — NVMe contention (checkpoint writes? fio?)"
        - alert: EtcdDbNearQuota
          expr: etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes > 0.8
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: "etcd DB >80 % of quota — compact + defrag before it goes read-only"
        - alert: ConntrackTableFilling
          expr: node_nf_conntrack_entries / node_nf_conntrack_entries_limit > 0.75
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "conntrack >75 % — new connections will be dropped at 100 %"
