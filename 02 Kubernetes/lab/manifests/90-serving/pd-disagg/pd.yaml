# Disaggregated prefill/decode (Volume 24) — ADVANCED / EXPERIMENTAL.
# One Spark: both roles share the GB10 via time-slicing (2 slices), so this
# demonstrates the *mechanics* (KV handoff over NIXL/UCX, routing, metrics),
# not a speed-up. On two Sparks, pin prefill to spark-01 and decode to
# spark-02 and let UCX use the CX-7 RDMA link (see Volume 24 §8).
# Pre-flight: kubectl exec deploy/vllm-prefill -- python3 -c "import nixl"
apiVersion: apps/v1
kind: Deployment
metadata: {name: vllm-prefill, namespace: llm-serving, labels: {app: vllm-prefill, pd-role: prefill}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: vllm-prefill}}
  template:
    metadata: {labels: {app: vllm-prefill, pd-role: prefill}}
    spec:
      containers:
        - name: vllm
          image: nvcr.io/nvidia/vllm:25.09-py3
          command: ["vllm", "serve", "Qwen/Qwen2.5-0.5B-Instruct"]
          args:
            - "--port=8000"
            - "--gpu-memory-utilization=0.15"
            - "--max-model-len=8192"
            - "--enforce-eager"
            - '--kv-transfer-config={"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          env:
            - {name: VLLM_NIXL_SIDE_CHANNEL_PORT, value: "5600"}
            - {name: VLLM_NIXL_SIDE_CHANNEL_HOST, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: UCX_TLS, value: "all"}
            - {name: HF_HOME, value: /models/hf}
          ports: [{name: http, containerPort: 8000}, {name: nixl, containerPort: 5600}]
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 180}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          resources:
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
            limits: {memory: 32Gi, nvidia.com/gpu: "1"}
          volumeMounts: [{name: models, mountPath: /models}, {name: shm, mountPath: /dev/shm}]
      volumes:
        - {name: models, persistentVolumeClaim: {claimName: model-cache}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 4Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vllm-decode, namespace: llm-serving, labels: {app: vllm-decode, pd-role: decode}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: vllm-decode}}
  template:
    metadata: {labels: {app: vllm-decode, pd-role: decode}}
    spec:
      containers:
        - name: vllm
          image: nvcr.io/nvidia/vllm:25.09-py3
          command: ["vllm", "serve", "Qwen/Qwen2.5-0.5B-Instruct"]
          args:
            - "--port=8000"
            - "--gpu-memory-utilization=0.15"
            - "--max-model-len=8192"
            - "--enforce-eager"
            - '--kv-transfer-config={"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          env:
            - {name: VLLM_NIXL_SIDE_CHANNEL_PORT, value: "5600"}
            - {name: VLLM_NIXL_SIDE_CHANNEL_HOST, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: UCX_TLS, value: "all"}
            - {name: HF_HOME, value: /models/hf}
          ports: [{name: http, containerPort: 8000}, {name: nixl, containerPort: 5600}]
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 180}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          resources:
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
            limits: {memory: 32Gi, nvidia.com/gpu: "1"}
          volumeMounts: [{name: models, mountPath: /models}, {name: shm, mountPath: /dev/shm}]
      volumes:
        - {name: models, persistentVolumeClaim: {claimName: model-cache}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 4Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: vllm-prefill, namespace: llm-serving}
spec:
  selector: {app: vllm-prefill}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: vllm-decode, namespace: llm-serving}
spec:
  selector: {app: vllm-decode}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pd-proxy, namespace: llm-serving, labels: {app: pd-proxy}}
spec:
  replicas: 1
  selector: {matchLabels: {app: pd-proxy}}
  template:
    metadata: {labels: {app: pd-proxy}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: proxy
          image: python:3.12-slim
          command: ["python3", "/app/pd_proxy.py"]
          env:
            - {name: PREFILL_URL, value: "http://vllm-prefill:8000"}
            - {name: DECODE_URL, value: "http://vllm-decode:8000"}
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {memory: 256Mi}}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes:
        - {name: app, configMap: {name: pd-proxy}}
---
apiVersion: v1
kind: Service
metadata: {name: pd-proxy, namespace: llm-serving}
spec:
  selector: {app: pd-proxy}
  ports: [{name: http, port: 8000, targetPort: http}]
