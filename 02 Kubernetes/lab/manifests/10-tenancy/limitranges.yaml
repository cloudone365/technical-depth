# Defaults so a pod without resources still lands inside the quota (Volume 12).
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: tenant-alpha
spec:
  limits:
    - type: Container
      default: {cpu: 250m, memory: 512Mi}
      defaultRequest: {cpu: 100m, memory: 256Mi}
      max: {cpu: "1", memory: 6Gi}
    - type: PersistentVolumeClaim
      max: {storage: 100Gi}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: tenant-beta
spec:
  limits:
    - type: Container
      default: {cpu: 250m, memory: 512Mi}
      defaultRequest: {cpu: 100m, memory: 256Mi}
      max: {cpu: "1", memory: 6Gi}
    - type: PersistentVolumeClaim
      max: {storage: 100Gi}
