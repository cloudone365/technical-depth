# Kueue: quota-aware job queueing + all-or-nothing admission (Volume 05).
# Install the controller first:  scripts/install-addons.sh kueue
#
#   ResourceFlavor  gb10          "what kind of capacity" (node labels)
#   ClusterQueue    spark-cq      "how much" — nominal quota for the whole Spark
#   LocalQueue      batch/train   "where tenants submit" (namespace-scoped)
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: gb10
spec:
  nodeLabels:
    nvidia.com/gpu.product: GB10
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: spark-cq
spec:
  namespaceSelector: {}                    # any namespace with a LocalQueue
  queueingStrategy: BestEffortFIFO         # small jobs may pass a blocked big one
  preemption:
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources: [cpu, memory, nvidia.com/gpu]
      flavors:
        - name: gb10
          resources:
            - name: cpu
              nominalQuota: "8"
            - name: memory
              nominalQuota: 64Gi
            - name: nvidia.com/gpu
              nominalQuota: "2"            # 2 of the 4 time-slices; serving keeps the rest
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: train
  namespace: batch
spec:
  clusterQueue: spark-cq
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: WorkloadPriorityClass
metadata:
  name: urgent
value: 1000
description: "Deadline runs — may preempt lower-priority queued work in spark-cq"
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: WorkloadPriorityClass
metadata:
  name: routine
value: 100
