# Priority & preemption on 4 GPU slices (Volume 05 §5.3).
# 1) filler: 4 preemptible pods take every slice
# 2) urgent: one serving-priority pod arrives → scheduler evicts one filler
apiVersion: apps/v1
kind: Deployment
metadata: {name: filler, namespace: lab-tools}
spec:
  replicas: 4
  selector: {matchLabels: {app: filler}}
  template:
    metadata: {labels: {app: filler}}
    spec:
      priorityClassName: spark-preemptible
      terminationGracePeriodSeconds: 5
      containers:
        - name: sleep
          image: nvcr.io/nvidia/cuda:13.0.1-base-ubuntu24.04
          command: ["sleep", "infinity"]
          resources: {limits: {nvidia.com/gpu: "1", memory: 64Mi}, requests: {cpu: 10m}}
---
apiVersion: v1
kind: Pod
metadata: {name: urgent, namespace: lab-tools}
spec:
  priorityClassName: spark-serving
  containers:
    - name: sleep
      image: nvcr.io/nvidia/cuda:13.0.1-base-ubuntu24.04
      command: ["sleep", "infinity"]
      resources: {limits: {nvidia.com/gpu: "1", memory: 64Mi}, requests: {cpu: 10m}}
