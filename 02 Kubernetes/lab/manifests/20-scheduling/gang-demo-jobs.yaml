# Two 2-pod "distributed" jobs that each need 2 GPU slices (Volume 05 lab).
# Without Kueue: both start one pod each → both hang waiting for rank 1 (deadlock).
# With Kueue:    job-a is admitted whole, job-b waits whole, then runs.
apiVersion: batch/v1
kind: Job
metadata:
  name: gang-a
  namespace: batch
  labels:
    kueue.x-k8s.io/queue-name: train
    kueue.x-k8s.io/priority-class: routine
spec:
  suspend: true                     # Kueue un-suspends when the whole job fits
  parallelism: 2
  completions: 2
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      priorityClassName: spark-batch
      containers:
        - name: worker
          image: nvcr.io/nvidia/cuda:13.0.1-base-ubuntu24.04
          command: ["bash", "-c", "echo rank=$JOB_COMPLETION_INDEX; nvidia-smi -L; sleep 120"]
          resources:
            requests: {cpu: "1", memory: 2Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "1", memory: 2Gi, nvidia.com/gpu: "1"}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gang-b
  namespace: batch
  labels:
    kueue.x-k8s.io/queue-name: train
    kueue.x-k8s.io/priority-class: routine
spec:
  suspend: true
  parallelism: 2
  completions: 2
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      priorityClassName: spark-batch
      containers:
        - name: worker
          image: nvcr.io/nvidia/cuda:13.0.1-base-ubuntu24.04
          command: ["bash", "-c", "echo rank=$JOB_COMPLETION_INDEX; nvidia-smi -L; sleep 120"]
          resources:
            requests: {cpu: "1", memory: 2Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "1", memory: 2Gi, nvidia.com/gpu: "1"}
