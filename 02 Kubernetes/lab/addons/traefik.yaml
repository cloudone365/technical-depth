# Traefik v3 as Ingress + Gateway API controller (Volume 09).
# Applied by scripts/install-addons.sh; k3s's built-in helm-controller
# turns this HelmChart object into a Helm release (no helm CLI needed).
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: traefik-lab
  namespace: kube-system
spec:
  repo: https://traefik.github.io/charts
  chart: traefik
  version: "34.4.1"
  targetNamespace: ingress
  createNamespace: true
  valuesContent: |-
    deployment:
      replicas: 1
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: false
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: true
      name: lab-gateway
      listeners:
        web:
          port: 8000
          protocol: HTTP
          namespacePolicy: All
    ports:
      web:
        # LLM streams can run for minutes; the defaults (readTimeout 60s)
        # cut long generations. 0s = no limit on the entrypoint; limit
        # per-route with a Middleware instead.
        transport:
          respondingTimeouts:
            readTimeout: 0s
            writeTimeout: 0s
            idleTimeout: 600s
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 0s
            writeTimeout: 0s
            idleTimeout: 600s
    service:
      type: LoadBalancer          # k3s servicelb binds 80/443 on the node IP
    metrics:
      prometheus:
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kps
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 512Mi}
