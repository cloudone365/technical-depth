# GitOps for the 02 lab with Argo CD (production-mlops.md).
# App-of-apps: this file creates one Application per manifests/ layer, in
# sync-wave order (platform → tenancy/policy → workloads → CRD-dependent layers).
# Install Argo CD first (see production-mlops.md), then:
#   kubectl apply -n argocd -f gitops/applications.yaml
# Point repoURL at YOUR fork if you want to push changes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spark-00-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/cloudone365/technical-depth.git
    targetRevision: main
    path: "02 Kubernetes/lab/manifests/00-platform"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false          # never auto-delete namespaces
      selfHeal: true
    syncOptions: [ServerSideApply=true, CreateNamespace=false]
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
---
