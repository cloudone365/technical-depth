# SGLang serving the FP8 R1-32B distill (Volume 16). Scale vLLM to 0 first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../02 Kubernetes/lab/manifests/llms/90-serving/sglang
patches:
  - target: {kind: Deployment, name: sglang}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --model-path=RedHatAI/DeepSeek-R1-Distill-Qwen-32B-FP8-dynamic
          - --served-model-name=r1-32b-fp8
          - --host=0.0.0.0
          - --port=30000
          - --mem-fraction-static=0.45
          - --context-length=32768
          - --reasoning-parser=deepseek-r1
          - --enable-metrics
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 56Gi
