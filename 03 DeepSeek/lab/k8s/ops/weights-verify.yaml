# Nightly integrity check of the served model's weights against a pinned
# manifest (Volume 33). Create the manifest once after a known-good download:
#   kubectl -n llm-serving exec deploy/vllm -- python3 /tools/weights_verify.py snapshot \
#     /models/hf/models--RedHatAI--DeepSeek-R1-Distill-Qwen-32B-FP8-dynamic/snapshots/<rev> --out /models/manifests/r1-32b-fp8.json
apiVersion: batch/v1
kind: CronJob
metadata: {name: weights-verify, namespace: llm-serving}
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: verify
              image: python:3.12-slim
              command: ["bash", "-c"]
              args:
                - |
                  set -e
                  for m in /models/manifests/*.json; do
                    root=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['root'])" "$m")
                    echo "== $m ($root)"; python3 /tools/weights_verify.py verify "$root" "$m"
                  done
              resources: {requests: {cpu: "1", memory: 128Mi}, limits: {memory: 512Mi}}
              volumeMounts:
                - {name: tools, mountPath: /tools}
                - {name: models, mountPath: /models, readOnly: true}
          volumes:
            - {name: tools, configMap: {name: deepseek-tools}}
            - {name: models, persistentVolumeClaim: {claimName: model-cache, readOnly: true}}
