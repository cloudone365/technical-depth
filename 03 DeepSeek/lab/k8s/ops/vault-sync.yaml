# Vault → Kubernetes Secret sync every 15 min (Volume 32). One-time setup:
#   scripts/vault-k8s-auth-setup.sh
#   kubectl -n llm-serving create configmap vault-ca --from-file=ca.crt="01 Ansible/lab/.cache/spark-lab-ca.crt"
apiVersion: v1
kind: ServiceAccount
metadata: {name: vault-sync, namespace: llm-serving}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: vault-sync, namespace: llm-serving}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hf-token, litellm-master-key]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: vault-sync, namespace: llm-serving}
subjects: [{kind: ServiceAccount, name: vault-sync, namespace: llm-serving}]
roleRef: {kind: Role, name: vault-sync, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: vault-sync, namespace: llm-serving}
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: vault-sync
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: sync
              image: python:3.12-slim
              command: ["python3", "/tools/vault_sync.py"]
              env:
                - {name: VAULT_ADDR, value: "https://10.10.10.11:8200"}
                - {name: VAULT_CACERT, value: /vault-ca/ca.crt}
                - {name: VAULT_ROLE, value: deepseek-serving}
                - name: SYNC_MAP
                  value: >-
                    [{"vault": "kv/data/spark-lab/deepseek/hf", "secret": "hf-token", "keys": {"token": "token"}},
                     {"vault": "kv/data/spark-lab/deepseek/litellm", "secret": "litellm-master-key", "keys": {"key": "master_key"}}]
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
              volumeMounts:
                - {name: tools, mountPath: /tools}
                - {name: vault-ca, mountPath: /vault-ca}
          volumes:
            - {name: tools, configMap: {name: deepseek-tools}}
            - {name: vault-ca, configMap: {name: vault-ca}}
