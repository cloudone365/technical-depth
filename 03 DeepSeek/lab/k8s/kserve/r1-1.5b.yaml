# The same R1 distill as an InferenceService (Volume 22). Uses 02's ServingRuntime
# 'vllm-spark' (RawDeployment: plain Deployment + Service + HPA, no Knative/Istio).
# KServe appends these args to the runtime's. Needs: 02 scripts/install-addons.sh kserve
#   kubectl apply -f "02 Kubernetes/lab/manifests/llms/90-serving/kserve/inferenceservice.yaml"   # runtime
#   kubectl apply -f k8s/kserve/r1-1.5b.yaml
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: r1-1-5b
  namespace: llm-serving
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/autoscalerClass: hpa
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    priorityClassName: spark-serving
    model:
      modelFormat: {name: huggingface}
      runtime: vllm-spark
      storageUri: hf://deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
      args: ["--reasoning-parser=deepseek_r1", "--max-model-len=16384", "--gpu-memory-utilization=0.15"]
