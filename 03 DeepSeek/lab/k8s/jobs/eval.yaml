# Run the evaluation harness against the currently served model (Volumes 34-37, 40).
# The code suite executes model-written Python, so it runs here, sandboxed
# (non-root, no capabilities, read-only root, no service account token).
#   MODEL=r1-7b envsubst < eval.yaml | kubectl apply -f -     (or edit the args)
apiVersion: batch/v1
kind: Job
metadata: {name: eval, namespace: llm-serving}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: eval
          image: python:3.12-slim
          command: ["python3", "/app/tools/eval_harness.py"]
          args: ["--url", "http://vllm.llm-serving:8000", "--model", "r1-7b",
                 "--concurrency", "8", "--out", "/results/eval.json"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: "1", memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
          volumeMounts:
            - {name: tools, mountPath: /app/tools}
            - {name: data, mountPath: /app/data}
            - {name: results, mountPath: /results}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tools, configMap: {name: deepseek-tools}}
        - {name: data, configMap: {name: deepseek-evaldata}}
        - {name: results, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
