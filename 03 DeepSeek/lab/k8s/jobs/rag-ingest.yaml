# Index this repository into Qdrant (Volume 29). Needs: Qdrant (02 manifests/llms/50-workloads),
# bge-m3 (k8s/apps), tools ConfigMap (kubectl apply -k "03 DeepSeek/lab").
apiVersion: batch/v1
kind: Job
metadata: {name: rag-ingest, namespace: llm-serving}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: clone
          image: alpine/git:v2.49.1
          args: ["clone", "--depth=1", "https://github.com/cloudone365/technical-depth.git", "/work/repo"]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
          volumeMounts: [{name: work, mountPath: /work}]
      containers:
        - name: ingest
          image: python:3.12-slim
          # builds technical-depth-<timestamp>, evaluates it on data/rag_gold.jsonl, and only then
          # moves the alias technical-depth to it (blue/green with a quality gate, Volume 29)
          command: ["python3", "/app/tools/rag_demo.py", "ingest", "--repo", "/work/repo",
                    "--dirs", "01 Ansible", "02 Kubernetes", "03 DeepSeek", "--gate", "0.6"]
          env: [{name: HOME, value: /work}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 500m, memory: 256Mi}, limits: {memory: 1Gi}}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: tools, mountPath: /app/tools}
            - {name: data, mountPath: /app/data}
      volumes:
        - {name: work, emptyDir: {}}
        - {name: tools, configMap: {name: deepseek-tools}}
        - {name: data, configMap: {name: deepseek-evaldata}}
