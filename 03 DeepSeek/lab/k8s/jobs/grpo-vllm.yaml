# GRPO with vLLM generating the rollouts inside the trainer process (Volume 25, colocate mode).
# Same task and rewards as grpo.yaml; compare step time and completions/s with HF generate.
# Runs on the NGC vLLM image (vLLM + NVIDIA torch), with TRL added on top.
apiVersion: batch/v1
kind: Job
metadata:
  name: grpo-vllm
  namespace: batch
  labels: {kueue.x-k8s.io/queue-name: train, kueue.x-k8s.io/priority-class: routine}
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      priorityClassName: spark-batch
      containers:
        - name: train
          image: nvcr.io/nvidia/vllm:25.09-py3
          command: ["bash", "-c"]
          args:
            - >-
              pip install --quiet trl==0.23.0 peft==0.17.1 transformers==4.56.2 accelerate==1.10.1 datasets==4.1.1 &&
              python3 /train/grpo_tiny.py --model Qwen/Qwen2.5-0.5B-Instruct --steps 200 --vllm --vllm-mode colocate --out /ckpt/grpo-vllm
          env:
            - {name: HF_HOME, value: /ckpt/hf}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
          resources:
            requests: {cpu: "4", memory: 24Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: 48Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: train, mountPath: /train}
            - {name: ckpt, mountPath: /ckpt}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: train, configMap: {name: deepseek-train}}
        - {name: ckpt, persistentVolumeClaim: {claimName: deepseek-ckpt}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
