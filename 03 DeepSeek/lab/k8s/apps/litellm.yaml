# LiteLLM proxy (Volume 28): one OpenAI-compatible endpoint with virtual model
# names, per-key budgets/rate limits and fallbacks in front of the lab's engines.
apiVersion: v1
kind: ConfigMap
metadata: {name: litellm-config, namespace: llm-serving}
data:
  config.yaml: |
    model_list:
      - model_name: reasoning            # clients ask for "reasoning", ops decide which model that is
        litellm_params: {model: hosted_vllm/r1-32b-fp8, api_base: http://vllm.llm-serving:8000/v1, api_key: none}
      - model_name: reasoning-fast
        litellm_params: {model: hosted_vllm/r1-7b, api_base: http://vllm.llm-serving:8000/v1, api_key: none}
      - model_name: reasoning-sglang
        litellm_params: {model: openai/r1-32b-fp8, api_base: http://sglang.llm-serving:30000/v1, api_key: none}
      - model_name: embeddings
        litellm_params: {model: hosted_vllm/bge-m3, api_base: http://bge-m3.llm-serving:8000/v1, api_key: none}
    router_settings:
      num_retries: 2
      timeout: 900                      # long reasoning chains
      fallbacks: [{"reasoning": ["reasoning-sglang", "reasoning-fast"]}]
    litellm_settings:
      drop_params: true
      request_timeout: 900
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
---
apiVersion: v1
kind: Secret
metadata: {name: litellm-master-key, namespace: llm-serving}
type: Opaque
stringData:
  key: "sk-lab-change-me"               # replace from Vault (Volume 32)
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: litellm, namespace: llm-serving, labels: {app: litellm}}
spec:
  replicas: 1
  selector: {matchLabels: {app: litellm}}
  template:
    metadata: {labels: {app: litellm}}
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.77.5-stable
          args: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom: {secretKeyRef: {name: litellm-master-key, key: key}}
          ports: [{name: http, containerPort: 4000}]
          readinessProbe: {httpGet: {path: /health/readiness, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/liveliness, port: http}, periodSeconds: 20, initialDelaySeconds: 30}
          resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {memory: 2Gi}}
          volumeMounts: [{name: cfg, mountPath: /app/config.yaml, subPath: config.yaml}]
      volumes:
        - {name: cfg, configMap: {name: litellm-config}}
---
apiVersion: v1
kind: Service
metadata: {name: litellm, namespace: llm-serving}
spec:
  selector: {app: litellm}
  ports: [{name: http, port: 4000, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: litellm, namespace: llm-serving}
spec:
  parentRefs: [{name: lab-gateway, namespace: ingress}]
  hostnames: ["api.lab.local"]
  rules:
    - timeouts: {request: 900s}
      backendRefs: [{name: litellm, port: 4000}]
