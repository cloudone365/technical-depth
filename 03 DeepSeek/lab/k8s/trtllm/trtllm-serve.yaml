# TensorRT-LLM (Volume 18) with its PyTorch backend: no separate engine build
# step, optimized kernels for Blackwell, OpenAI-compatible server.
# Confirm the NGC tag that supports DGX Spark (sm_121/arm64) before applying.
apiVersion: apps/v1
kind: Deployment
metadata: {name: trtllm, namespace: llm-serving, labels: {app: trtllm}}
spec:
  replicas: 0                              # scale to 1 after scaling vllm/sglang to 0
  strategy: {type: Recreate}
  selector: {matchLabels: {app: trtllm}}
  template:
    metadata: {labels: {app: trtllm}}
    spec:
      priorityClassName: spark-serving
      containers:
        - name: trtllm
          image: nvcr.io/nvidia/tensorrt-llm/release:1.1.0
          command: ["bash", "-c"]
          args:
            - |
              cat > /tmp/extra.yaml <<'YAML'
              kv_cache_config:
                free_gpu_memory_fraction: 0.45
                enable_block_reuse: true
              YAML
              trtllm-serve "$MODEL" --host 0.0.0.0 --port 8000 --backend pytorch \
                --max_seq_len 32768 --max_batch_size 32 --extra_llm_api_options /tmp/extra.yaml
          env:
            - {name: MODEL, value: RedHatAI/DeepSeek-R1-Distill-Qwen-32B-FP8-dynamic}
            - {name: HF_HOME, value: /models/hf}
          ports: [{name: http, containerPort: 8000}]
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 180}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          resources:
            requests: {cpu: "4", memory: 16Gi, nvidia.com/gpu: "1"}
            limits: {memory: 64Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: models, persistentVolumeClaim: {claimName: model-cache}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: trtllm, namespace: llm-serving}
spec:
  selector: {app: trtllm}
  ports: [{name: http, port: 8000, targetPort: http}]
