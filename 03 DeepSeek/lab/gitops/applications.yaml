# GitOps for the 03 DeepSeek lab with Argo CD (28-production-mlops-and-gitops.md).
# Requires the 02 platform (its own gitops/applications.yaml) and Argo CD.
#   kubectl apply -n argocd -f "03 DeepSeek/lab/gitops/applications.yaml"
# Point repoURL at YOUR fork if you want to push changes.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deepseek-00-tools                      # ConfigMaps: tools, eval data, catalog
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/cloudone365/technical-depth.git
    targetRevision: main
    path: "03 DeepSeek/lab"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [ServerSideApply=true, CreateNamespace=false]
    retry:
      limit: 3
      backoff: {duration: 30s, factor: 2, maxDuration: 10m}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deepseek-10-serving                      # the served model (pointer) + PostSync eval gate
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/cloudone365/technical-depth.git
    targetRevision: main
    path: "03 DeepSeek/lab/k8s/serving"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
