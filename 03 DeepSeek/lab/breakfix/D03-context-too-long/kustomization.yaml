# D03: --max-model-len 131072 for the BF16 32B model at 0.70. Symptom: startup
# fails because one maximum-length sequence does not fit in the KV cache.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../k8s/models/r1-32b]
patches:
  - target: {kind: Deployment, name: vllm}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args/5
        value: --max-model-len=131072
