# D02: --gpu-memory-utilization 0.95 on a unified-memory box. Symptom: vLLM
# refuses to start (free memory < requested) or the node goes into MemoryPressure.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../k8s/models/r1-7b]
patches:
  - target: {kind: Deployment, name: vllm}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args/4
        value: --gpu-memory-utilization=0.95
