<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 520" width="1700" height="520" role="img" aria-label="Build order" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect width="1700" height="520" fill="#ffffff"/><text x="40" y="50" font-size="28" font-weight="700" text-anchor="start" fill="#1c1f23">Build order with checkpoints: do not continue until each check passes</text><rect x="45" y="100" width="290" height="130" rx="14" fill="#ffffff" stroke="#5b6470" stroke-width="2.5"/><text x="63" y="144" font-size="23" font-weight="700" text-anchor="start" fill="#1c1f23">2.1 Prepare VMs</text><text x="63" y="192" font-size="18" font-weight="400" text-anchor="start" fill="#374151">Check: hostname, IP, time, SSH</text><polyline points="337,165 373,165" fill="none" stroke="#5b6470" stroke-width="3" marker-end="url(#m-gray)"/><rect x="375" y="100" width="290" height="130" rx="14" fill="#ffffff" stroke="#0b7a75" stroke-width="2.5"/><text x="393" y="144" font-size="23" font-weight="700" text-anchor="start" fill="#1c1f23">3 Build Vault</text><text x="393" y="192" font-size="18" font-weight="400" text-anchor="start" fill="#374151">Check: vault status: unsealed</text><polyline points="667,165 703,165" fill="none" stroke="#5b6470" stroke-width="3" marker-end="url(#m-gray)"/><rect x="705" y="100" width="290" height="130" rx="14" fill="#ffffff" stroke="#0b7a75" stroke-width="2.5"/><text x="723" y="144" font-size="23" font-weight="700" text-anchor="start" fill="#1c1f23">4 SSH CA + AppRole</text><text x="723" y="192" font-size="18" font-weight="400" text-anchor="start" fill="#374151">Check: role and policy exist</text><polyline points="997,165 1033,165" fill="none" stroke="#5b6470" stroke-width="3" marker-end="url(#m-gray)"/><rect x="1035" y="100" width="290" height="130" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/><text x="1053" y="144" font-size="23" font-weight="700" text-anchor="start" fill="#1c1f23">5 Trust the CA</text><text x="1053" y="192" font-size="18" font-weight="400" text-anchor="start" fill="#374151">Check: fingerprints match</text><polyline points="1327,165 1363,165" fill="none" stroke="#5b6470" stroke-width="3" marker-end="url(#m-gray)"/><rect x="1365" y="100" width="290" height="130" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/><text x="1383" y="144" font-size="23" font-weight="700" text-anchor="start" fill="#1c1f23">6 Manual test</text><text x="1383" y="192" font-size="18" font-weight="400" text-anchor="start" fill="#374151">Check: sudo -n whoami = root</text><rect x="45" y="300" width="290" height="130" rx="14" fill="#ffffff" stroke="#1f6feb" stroke-width="2.5"/><text x="63" y="344" font-size="23" font-weight="700" text-anchor="start" fill="#1c1f23">7 Install Semaphore</text><text x="63" y="392" font-size="18" font-weight="400" text-anchor="start" fill="#374151">Check: docker compose ps: Up</text><polyline points="337,365 373,365" fill="none" stroke="#5b6470" stroke-width="3" marker-end="url(#m-gray)"/><rect x="375" y="300" width="290" height="130" rx="14" fill="#ffffff" stroke="#1f6feb" stroke-width="2.5"/><text x="393" y="344" font-size="23" font-weight="700" text-anchor="start" fill="#1c1f23">8 Git, keys, template</text><text x="393" y="392" font-size="18" font-weight="400" text-anchor="start" fill="#374151">Check: job output shows root</text><polyline points="667,365 703,365" fill="none" stroke="#5b6470" stroke-width="3" marker-end="url(#m-gray)"/><rect x="705" y="300" width="290" height="130" rx="14" fill="#ffffff" stroke="#1f6feb" stroke-width="2.5"/><text x="723" y="344" font-size="23" font-weight="700" text-anchor="start" fill="#1c1f23">9 Verify the chain</text><text x="723" y="392" font-size="18" font-weight="400" text-anchor="start" fill="#374151">Check: logs on all 3 systems</text><polyline points="997,365 1033,365" fill="none" stroke="#5b6470" stroke-width="3" marker-end="url(#m-gray)"/><rect x="1035" y="300" width="290" height="130" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/><text x="1053" y="344" font-size="23" font-weight="700" text-anchor="start" fill="#1c1f23">10 Maintenance plays</text><text x="1053" y="392" font-size="18" font-weight="400" text-anchor="start" fill="#374151">Check: apt history, chronyc</text><polyline points="1327,365 1363,365" fill="none" stroke="#5b6470" stroke-width="3" marker-end="url(#m-gray)"/><rect x="1365" y="300" width="290" height="130" rx="14" fill="#ffffff" stroke="#5b6470" stroke-width="2.5"/><text x="1383" y="344" font-size="23" font-weight="700" text-anchor="start" fill="#1c1f23">11 Harden</text><text x="1383" y="392" font-size="18" font-weight="400" text-anchor="start" fill="#374151">Check: roadmap items</text><polyline points="1510,232 1510,266 190,266 190,298" fill="none" stroke="#5b6470" stroke-width="3" marker-end="url(#m-gray)"/></svg>