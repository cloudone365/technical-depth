<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 930" width="1440" height="930" role="img" aria-label="Authentication flow" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect width="1440" height="930" fill="#ffffff"/><text x="40" y="44" font-size="30" font-weight="700" text-anchor="start" fill="#1c1f23">Authentication flow: one short-lived certificate per task run</text><line x1="150" y1="130" x2="150" y2="910" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 8"/><rect x="50" y="70" width="200" height="56" rx="12" fill="#fff" stroke="#5b6470" stroke-width="2.5"/><text x="150" y="106" font-size="22" font-weight="700" text-anchor="middle" fill="#1c1f23">Engineer</text><line x1="520" y1="130" x2="520" y2="910" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 8"/><rect x="420" y="70" width="200" height="56" rx="12" fill="#fff" stroke="#1f6feb" stroke-width="2.5"/><text x="520" y="106" font-size="22" font-weight="700" text-anchor="middle" fill="#1c1f23">Semaphore</text><line x1="940" y1="130" x2="940" y2="910" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 8"/><rect x="840" y="70" width="200" height="56" rx="12" fill="#fff" stroke="#0b7a75" stroke-width="2.5"/><text x="940" y="106" font-size="22" font-weight="700" text-anchor="middle" fill="#1c1f23">Vault SSH CA</text><line x1="1290" y1="130" x2="1290" y2="910" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 8"/><rect x="1190" y="70" width="200" height="56" rx="12" fill="#fff" stroke="#b45309" stroke-width="2.5"/><text x="1290" y="106" font-size="22" font-weight="700" text-anchor="middle" fill="#1c1f23">Target host</text><polyline points="156,190 514,190" fill="none" stroke="#5b6470" stroke-width="3" marker-end="url(#m-gray)"/><rect x="202" y="158" width="267" height="29" rx="4" fill="#ffffff"/><text x="335" y="178" font-size="20" font-weight="400" text-anchor="middle" fill="#1c1f23">1 Run task (RBAC check)</text><polyline points="526,252 934,252" fill="none" stroke="#0b7a75" stroke-width="3" marker-end="url(#m-teal)"/><rect x="597" y="220" width="267" height="29" rx="4" fill="#ffffff"/><text x="730" y="240" font-size="20" font-weight="400" text-anchor="middle" fill="#1c1f23">2 Play 1: AppRole login</text><polyline points="934,314 526,314" fill="none" stroke="#0b7a75" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#m-teal)"/><rect x="580" y="282" width="300" height="29" rx="4" fill="#ffffff"/><text x="730" y="302" font-size="20" font-weight="400" text-anchor="middle" fill="#1c1f23">3 Token (sign-only policy)</text><polyline points="526,376 934,376" fill="none" stroke="#0b7a75" stroke-width="3" marker-end="url(#m-teal)"/><rect x="553" y="344" width="355" height="29" rx="4" fill="#ffffff"/><text x="730" y="364" font-size="20" font-weight="400" text-anchor="middle" fill="#1c1f23">4 Sign public key (svc-ansible)</text><polyline points="934,438 526,438" fill="none" stroke="#0b7a75" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#m-teal)"/><rect x="547" y="406" width="366" height="29" rx="4" fill="#ffffff"/><text x="730" y="426" font-size="20" font-weight="400" text-anchor="middle" fill="#1c1f23">5 Signed certificate, 15 min TTL</text><polyline points="526,500 1284,500" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#m-amber)"/><rect x="684" y="468" width="443" height="29" rx="4" fill="#ffffff"/><text x="905" y="488" font-size="20" font-weight="400" text-anchor="middle" fill="#1c1f23">6 SSH as svc-ansible: key + certificate</text><polyline points="1284,680 526,680" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#m-amber)"/><rect x="783" y="648" width="245" height="29" rx="4" fill="#ffffff"/><text x="905" y="668" font-size="20" font-weight="400" text-anchor="middle" fill="#1c1f23">8 Session established</text><polyline points="526,742 1284,742" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#m-amber)"/><rect x="733" y="710" width="344" height="29" rx="4" fill="#ffffff"/><text x="905" y="730" font-size="20" font-weight="400" text-anchor="middle" fill="#1c1f23">9 sudo NOPASSWD runs the tasks</text><polyline points="1284,804 526,804" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#m-amber)"/><rect x="816" y="772" width="179" height="29" rx="4" fill="#ffffff"/><text x="905" y="792" font-size="20" font-weight="400" text-anchor="middle" fill="#1c1f23">10 Task results</text><polyline points="514,866 156,866" fill="none" stroke="#5b6470" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#m-gray)"/><rect x="213" y="834" width="245" height="29" rx="4" fill="#ffffff"/><text x="335" y="854" font-size="20" font-weight="400" text-anchor="middle" fill="#1c1f23">11 Task log + history</text><rect x="1180" y="548" width="220" height="68" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/><text x="1290" y="578" font-size="18" font-weight="600" text-anchor="middle" fill="#1c1f23">7 Verify CA signature,</text><text x="1290" y="602" font-size="18" font-weight="600" text-anchor="middle" fill="#1c1f23">principal and expiry</text></svg>