---
# ------------------------------------------------------------------------
# Global lab settings — change these first.
# ------------------------------------------------------------------------
lab_name: spark-lab
lab_domain: lab.local
lab_timezone: America/New_York

# The same admin user must exist on every Spark (NVIDIA's multi-node
# playbooks assume this too).
spark_admin_user: nvidia
spark_admin_pubkeys:
  - "{{ lookup('ansible.builtin.file', '~/.ssh/id_ed25519.pub', errors='ignore') | default('', true) }}"

# Management network
mgmt_interface: enP7s7
mgmt_cidr: 192.168.0.0/24
mgmt_gateway: 192.168.0.1
dns_servers: [192.168.0.1, 1.1.1.1]
ntp_servers: [time.cloudflare.com, pool.ntp.org]

# Where the lab keeps its state on the controller: kubeconfigs, join files,
# reports, incident bundles. On your MacBook that is lab/.cache (git-ignored).
# Semaphore sets SPARK_LAB_CACHE to a persistent volume, because its checkout of
# the repository is temporary (00b guide §4).
lab_cache_dir: "{{ lookup('ansible.builtin.env', 'SPARK_LAB_CACHE') | default(inventory_dir ~ '/../.cache', true) }}"
lab_artifacts_dir: "{{ lab_cache_dir }}/artifacts"

# ------------------------------------------------------------------------
# Management plane — OUTSIDE the Sparks, built by the 00a guide
# (00a-semaphore-vault-lab-guide.md). Not in this inventory on purpose:
# no lab playbook ever configures them over SSH.
#   sema01   192.168.0.210   Semaphore UI (Docker), runs every playbook
#   vault01  192.168.0.211   HashiCorp Vault: SSH CA + lab secrets
# ------------------------------------------------------------------------
semaphore_url: http://192.168.0.210:3000
vault_addr: https://192.168.0.211:8200
# Vault's TLS certificate as the controller sees it: the copy mounted into the
# Semaphore container (00a §7.3), or the one you copied to the MacBook (00b §2).
vault_cacert: "{{ '/etc/semaphore/vault-ca.crt' if vault_role_id is defined else lab_cache_dir ~ '/vault-ca.crt' }}"
vault_ssh_mount: ssh-client-signer       # SSH secrets engine path on vault01
vault_ssh_role: ansible                  # signing role: principal svc-ansible, 15-minute certificates
vault_ssh_principal: svc-ansible         # the automation account on every Spark
vault_ssh_key_dir: /tmp/lab_ssh          # where play 1 keeps the key + certificate (inside the Semaphore container)
# Certificate lifetime asked for by play 1 (the vault01 role allows up to 1h).
# Long tasks that reconnect late — reboots in 17-dgxos-upgrade, 21-emergency-drain,
# site — set vault_ssh_cert_ttl=1h as a template extra variable.
vault_ssh_cert_ttl: 15m
# Lab secrets in vault01's KV engine (08-vault.yml creates the mount and policy).
vault_kv_mount: kv
vault_kv_prefix: spark-lab
vault_lab_secrets_enabled: false         # set true (Semaphore variable group) once 08-vault.yml has run
