---
# ------------------------------------------------------------------------
# Global lab settings — change these first.
# ------------------------------------------------------------------------
lab_name: spark-lab
lab_domain: lab.local
lab_timezone: America/New_York

# The same admin user must exist on every Spark (NVIDIA's multi-node
# playbooks assume this too).
spark_admin_user: nvidia
spark_admin_pubkeys:
  - "{{ lookup('ansible.builtin.file', '~/.ssh/id_ed25519.pub', errors='ignore') | default('', true) }}"

# Management network
mgmt_interface: enP7s7
mgmt_cidr: 192.168.0.0/24
mgmt_gateway: 192.168.0.1
dns_servers: [192.168.0.1, 1.1.1.1]
ntp_servers: [time.cloudflare.com, pool.ntp.org]

# Where things live on the control node
lab_artifacts_dir: "{{ playbook_dir }}/../.cache/artifacts"
