---
# Runs on localhost; talks to Vault's HTTP API with ansible.builtin.uri so every
# call is visible and idempotent (GET → compare → POST only when different).
- name: Vault API defaults
  ansible.builtin.set_fact:
    vault_config_headers:
      X-Vault-Token: "{{ vault_config_token }}"
  no_log: true

# ------------------------------------------------------------ secret engines
- name: List mounted secret engines
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/sys/mounts"
    headers: "{{ vault_config_headers }}"
    ca_path: "{{ vault_config_cacert }}"
  register: vault_config_mounts

- name: Enable secret engines
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/sys/mounts/{{ item.path }}"
    method: POST
    headers: "{{ vault_config_headers }}"
    ca_path: "{{ vault_config_cacert }}"
    body_format: json
    body: { type: "{{ item.type }}", options: "{{ item.options | default({}) }}" }
    status_code: [200, 204]
  loop: "{{ vault_config_secret_engines }}"
  when: (item.path ~ '/') not in vault_config_mounts.json.data
  changed_when: true

# ------------------------------------------------------------ auth methods
- name: List auth methods
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/sys/auth"
    headers: "{{ vault_config_headers }}"
    ca_path: "{{ vault_config_cacert }}"
  register: vault_config_auths

- name: Enable auth methods
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/sys/auth/{{ item.path }}"
    method: POST
    headers: "{{ vault_config_headers }}"
    ca_path: "{{ vault_config_cacert }}"
    body_format: json
    body: { type: "{{ item.type }}" }
    status_code: [200, 204]
  loop: "{{ vault_config_auth_methods }}"
  when: (item.path ~ '/') not in vault_config_auths.json.data
  changed_when: true

# ------------------------------------------------------------ audit (who read which secret)
- name: List audit devices
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/sys/audit"
    headers: "{{ vault_config_headers }}"
    ca_path: "{{ vault_config_cacert }}"
  register: vault_config_audit

- name: Enable file audit device
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/sys/audit/file"
    method: PUT
    headers: "{{ vault_config_headers }}"
    ca_path: "{{ vault_config_cacert }}"
    body_format: json
    body: { type: file, options: { file_path: /var/log/vault/audit.log } }
    status_code: [200, 204]
  when: "'file/' not in vault_config_audit.json.data | default(vault_config_audit.json)"
  changed_when: true

# ------------------------------------------------------------ policies
- name: Read current policies
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/sys/policies/acl/{{ item.key }}"
    headers: "{{ vault_config_headers }}"
    ca_path: "{{ vault_config_cacert }}"
    status_code: [200, 404]
  loop: "{{ vault_config_policies | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: vault_config_pol_current

- name: Write policies that differ
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/sys/policies/acl/{{ item.item.key }}"
    method: PUT
    headers: "{{ vault_config_headers }}"
    ca_path: "{{ vault_config_cacert }}"
    body_format: json
    body: { policy: "{{ item.item.value }}" }
    status_code: [200, 204]
  loop: "{{ vault_config_pol_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: item.status == 404 or (item.json.data.policy | trim) != (item.item.value | trim)
  changed_when: true

# ------------------------------------------------------------ AppRoles
- name: Configure AppRoles (write is idempotent server-side; compare to report change)
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/auth/approle/role/{{ item.name }}"
    method: POST
    headers: "{{ vault_config_headers }}"
    ca_path: "{{ vault_config_cacert }}"
    body_format: json
    body: "{{ item | dict2items | rejectattr('key', 'equalto', 'name') | items2dict }}"
    status_code: [200, 204]
  loop: "{{ vault_config_approles }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

# ------------------------------------------------------------ SSH CA
- name: Check SSH CA
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/ssh-client-signer/config/ca"
    headers: "{{ vault_config_headers }}"
    ca_path: "{{ vault_config_cacert }}"
    status_code: [200, 400, 404]
  register: vault_config_sshca

- name: Generate SSH CA key pair inside Vault
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/ssh-client-signer/config/ca"
    method: POST
    headers: "{{ vault_config_headers }}"
    ca_path: "{{ vault_config_cacert }}"
    body_format: json
    body: { generate_signing_key: true, key_type: ed25519 }
    status_code: [200, 204]
  when: vault_config_sshca.status != 200
  changed_when: true

- name: SSH signing role
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/ssh-client-signer/roles/{{ vault_config_ssh_role.name }}"
    method: POST
    headers: "{{ vault_config_headers }}"
    ca_path: "{{ vault_config_cacert }}"
    body_format: json
    body:
      key_type: ca
      algorithm_signer: default
      allow_user_certificates: true
      allowed_users: "{{ vault_config_ssh_role.allowed_users }}"
      default_user: "{{ vault_config_ssh_role.default_user }}"
      default_extensions: { permit-pty: "" }
      ttl: "{{ vault_config_ssh_role.ttl }}"
    status_code: [200, 204]
  changed_when: false

- name: Seed an example secret (NGC key placeholder)
  ansible.builtin.uri:
    url: "{{ vault_config_addr }}/v1/kv/data/spark-lab/ngc"
    method: POST
    headers: "{{ vault_config_headers }}"
    ca_path: "{{ vault_config_cacert }}"
    body_format: json
    body: { data: { api_key: "REPLACE_ME" }, options: { cas: 0 } }   # cas=0: only if absent
    status_code: [200, 204, 400]
  register: vault_config_seed
  changed_when: vault_config_seed.status == 200
