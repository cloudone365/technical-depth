---
# vault01 is built and owned by the 00a guide (SSH CA, signing role 'ansible',
# AppRole 'semaphore', audit log). This role only ADDS what the Spark lab needs
# and never rewrites those: it checks them, then
#   * mounts a KV v2 engine for lab secrets (NGC key, Grafana password …)
#   * writes a read-only policy for kv/spark-lab/*
#   * attaches that policy to the 'semaphore' AppRole (keeping semaphore-ssh)
vault_config_addr: "{{ vault_addr }}"
vault_config_cacert: "{{ vault_cacert }}"
# An admin token for this one run, from the environment — never stored.
#   on vault01: vault login  →  export VAULT_TOKEN=…  (or a named admin's token)
vault_config_token: "{{ lookup('ansible.builtin.env', 'VAULT_TOKEN') }}"

vault_config_ssh_mount: "{{ vault_ssh_mount }}"
vault_config_ssh_role: "{{ vault_ssh_role }}"
vault_config_ssh_principal: "{{ vault_ssh_principal }}"
vault_config_approle: semaphore

vault_config_kv_mount: "{{ vault_kv_mount }}"
vault_config_kv_prefix: "{{ vault_kv_prefix }}"
vault_config_policy_name: spark-lab-read
vault_config_policy: |
  # Semaphore tasks may read the Spark lab's secrets, nothing else
  path "{{ vault_config_kv_mount }}/data/{{ vault_config_kv_prefix }}/*"     { capabilities = ["read"] }
  path "{{ vault_config_kv_mount }}/metadata/{{ vault_config_kv_prefix }}/*" { capabilities = ["list", "read"] }

# Placeholders written only when absent (cas=0); put the real values in with
#   vault kv put kv/spark-lab/ngc api_key=…
vault_config_seed_secrets:
  ngc: { api_key: REPLACE_ME }
