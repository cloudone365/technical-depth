---
- name: Restart vault
  ansible.builtin.systemd_service:
    name: vault
    state: restarted
  # NOTE: a restart re-seals Vault. The play unseals afterwards; in production
  # use auto-unseal so restarts are not an outage.

- name: Update CA trust
  ansible.builtin.command: update-ca-certificates
  changed_when: true
