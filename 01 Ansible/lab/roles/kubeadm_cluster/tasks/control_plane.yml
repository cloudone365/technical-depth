---
- name: Control-plane directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ kubeadm_cluster_audit_dir }}", mode: "0755" }
    - { path: "{{ kubeadm_cluster_audit_log_dir }}", mode: "0750" }
    - { path: "{{ kubeadm_cluster_encryption_dir }}", mode: "0700" }
    - { path: "{{ kubeadm_cluster_etcd_snapshot_dir }}", mode: "0700" }
    - { path: /data/k8s, mode: "0755" }

# Identical copy lives at "02 Kubernetes/lab/kubeadm/audit-policy.yaml" (the 02 lab tests diff them).
- name: Audit policy
  ansible.builtin.copy:
    src: audit-policy.yaml
    dest: "{{ kubeadm_cluster_audit_dir }}/audit-policy.yaml"
    owner: root
    group: root
    mode: "0644"

# ---- Secret encryption at rest: generate the AES key once, never rotate it by accident
- name: Existing encryption config?
  ansible.builtin.stat:
    path: "{{ kubeadm_cluster_encryption_dir }}/config.yaml"
  register: kubeadm_cluster_enc

- name: Generate a 32-byte key for aescbc
  ansible.builtin.command: openssl rand -base64 32
  register: kubeadm_cluster_enc_key
  changed_when: false
  no_log: true
  when: not kubeadm_cluster_enc.stat.exists

- name: Write EncryptionConfiguration (first run only)
  ansible.builtin.template:
    src: encryption-config.yaml.j2
    dest: "{{ kubeadm_cluster_encryption_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not kubeadm_cluster_enc.stat.exists

# ---- kubeadm init
- name: Write kubeadm config
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0600"
  register: kubeadm_cluster_cfg

- name: Already initialised?
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_cluster_admin_conf

- name: Pre-pull control-plane images (several hundred MB)
  ansible.builtin.command: kubeadm config images pull --config /etc/kubernetes/kubeadm-config.yaml
  changed_when: true
  when: not kubeadm_cluster_admin_conf.stat.exists

- name: Kubeadm init
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  register: kubeadm_cluster_init
  changed_when: true
  when: not kubeadm_cluster_admin_conf.stat.exists

- name: Kubeadm does not reconcile a running cluster — say so when the config changed
  ansible.builtin.debug:
    msg: >-
      /etc/kubernetes/kubeadm-config.yaml changed but the cluster already exists. Apply control-plane
      flag changes with: sudo kubeadm init phase control-plane all --config /etc/kubernetes/kubeadm-config.yaml
      (static pods restart one by one). Kubelet changes: edit /var/lib/kubelet/config.yaml and restart kubelet.
  when:
    - kubeadm_cluster_admin_conf.stat.exists
    - kubeadm_cluster_cfg is changed

- name: API server is ready
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw /readyz
  register: kubeadm_cluster_ready
  until: kubeadm_cluster_ready.rc == 0
  retries: 40
  delay: 5
  changed_when: false
  check_mode: false        # read-only probe: must also run under --check (drift detection)

# ---- kubectl for the admin user on the Spark itself
- name: Kube config directory for the admin user
  ansible.builtin.file:
    path: "/home/{{ spark_admin_user | default('nvidia') }}/.kube"
    state: directory
    owner: "{{ spark_admin_user | default('nvidia') }}"
    group: "{{ spark_admin_user | default('nvidia') }}"
    mode: "0700"

- name: Read admin.conf
  ansible.builtin.slurp:
    src: /etc/kubernetes/admin.conf
  register: kubeadm_cluster_admin_slurp

# Same context name as on the control node, so lab scripts that pass
# '--context spark-root' (etcd-drill.sh, verify.sh …) also work on the Spark.
- name: Admin kubeconfig for the admin user (context renamed to {{ kubeadm_cluster_context }})
  ansible.builtin.copy:
    content: >-
      {{ kubeadm_cluster_admin_slurp.content | b64decode
         | regex_replace('kubernetes-admin@' ~ kubeadm_cluster_name, kubeadm_cluster_context) }}
    dest: "/home/{{ spark_admin_user | default('nvidia') }}/.kube/config"
    owner: "{{ spark_admin_user | default('nvidia') }}"
    group: "{{ spark_admin_user | default('nvidia') }}"
    mode: "0600"

# ---- kubeconfig on the control node: context 'spark-root', merged with any vCluster contexts
- name: Fetch admin.conf to the control node
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeadm_cluster_kubeconfig_local }}.admin-raw"
    flat: true

- name: Merge the root context into the lab kubeconfig
  ansible.builtin.copy:
    dest: "{{ kubeadm_cluster_kubeconfig_local }}"
    mode: "0600"
    content: "{{ kubeadm_cluster_merged | to_nice_yaml(indent=2) }}"
  vars:
    kubeadm_cluster_raw: "{{ lookup('ansible.builtin.file', kubeadm_cluster_kubeconfig_local ~ '.admin-raw') | from_yaml }}"
    kubeadm_cluster_existing: >-
      {{ (lookup('ansible.builtin.file', kubeadm_cluster_kubeconfig_local, errors='ignore') | default('', true) | from_yaml)
         or {'clusters': [], 'users': [], 'contexts': []} }}
    kubeadm_cluster_merged:
      apiVersion: v1
      kind: Config
      current-context: "{{ kubeadm_cluster_context }}"
      clusters: >-
        {{ (kubeadm_cluster_existing.clusters | default([]) | rejectattr('name', 'eq', kubeadm_cluster_context) | list)
           + [{'name': kubeadm_cluster_context, 'cluster': kubeadm_cluster_raw.clusters[0].cluster}] }}
      users: >-
        {{ (kubeadm_cluster_existing.users | default([]) | rejectattr('name', 'eq', kubeadm_cluster_context ~ '-admin') | list)
           + [{'name': kubeadm_cluster_context ~ '-admin', 'user': kubeadm_cluster_raw.users[0].user}] }}
      contexts: >-
        {{ (kubeadm_cluster_existing.contexts | default([]) | rejectattr('name', 'eq', kubeadm_cluster_context) | list)
           + [{'name': kubeadm_cluster_context, 'context': {'cluster': kubeadm_cluster_context, 'user': kubeadm_cluster_context ~ '-admin'}}] }}
  delegate_to: localhost
  become: false
  no_log: true

- name: Remove the raw copy (it holds the cluster-admin key)
  ansible.builtin.file:
    path: "{{ kubeadm_cluster_kubeconfig_local }}.admin-raw"
    state: absent
  delegate_to: localhost
  become: false

# ---- etcd tooling matching the etcd version kubeadm deployed
- name: Read the etcd image kubeadm chose
  ansible.builtin.command: grep -oP 'image:\s*\S+/etcd:\K[0-9.]+' /etc/kubernetes/manifests/etcd.yaml
  register: kubeadm_cluster_etcd_ver
  changed_when: false
  check_mode: false        # read-only probe: must also run under --check (drift detection)

- name: Installed etcdctl version
  ansible.builtin.command: etcdctl version
  register: kubeadm_cluster_etcdctl_ver
  changed_when: false
  failed_when: false
  check_mode: false        # read-only probe: must also run under --check (drift detection)

- name: Download arm64 etcdctl/etcdutl matching etcd {{ kubeadm_cluster_etcd_ver.stdout }}
  ansible.builtin.unarchive:
    src: >-
      https://github.com/etcd-io/etcd/releases/download/v{{ kubeadm_cluster_etcd_ver.stdout }}/etcd-v{{ kubeadm_cluster_etcd_ver.stdout }}-linux-arm64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=1, --wildcards, "*/etcdctl", "*/etcdutl"]
    mode: "0755"
  when: kubeadm_cluster_etcd_ver.stdout not in (kubeadm_cluster_etcdctl_ver.stdout | default(''))

- name: Etcd snapshot script
  ansible.builtin.template:
    src: etcd-snapshot.sh.j2
    dest: /usr/local/sbin/etcd-snapshot
    owner: root
    group: root
    mode: "0755"

- name: Etcd snapshot service + timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [etcd-snapshot.service, etcd-snapshot.timer]
  notify: Reload systemd

- name: Apply systemd changes
  ansible.builtin.meta: flush_handlers

- name: Etcd snapshot timer enabled
  ansible.builtin.systemd_service:
    name: etcd-snapshot.timer
    state: started
    enabled: true
