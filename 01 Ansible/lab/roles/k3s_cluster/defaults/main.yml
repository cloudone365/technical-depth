---
k3s_cluster_version: v1.32.5+k3s1          # pin! check https://github.com/k3s-io/k3s/releases
k3s_cluster_install_url: https://get.k3s.io
k3s_cluster_server_group: k3s_server
k3s_cluster_agent_group: k3s_agent

# API/management traffic on the 10GbE mgmt network; pod-to-pod (flannel VXLAN)
# over the 200GbE CX-7 link when it exists.
k3s_cluster_node_ip: "{{ ansible_host }}"
k3s_cluster_flannel_iface: >-
  {{ cx7_interfaces[0].name
     if (cx7_interfaces | default([]) | length > 0 and groups['spark'] | length > 1)
     else mgmt_interface | default('enP7s7') }}

# k3s auto-detects nvidia-container-runtime and registers an 'nvidia' runtime
# handler; making it the default means every pod can see the GPU without a
# RuntimeClass (convenient for a lab, set false for strict multi-tenancy).
k3s_cluster_default_runtime_nvidia: true

k3s_cluster_disable: [traefik]               # bring your own ingress (Volume 13)
k3s_cluster_kubelet_args:
  - "system-reserved=cpu=2,memory=8Gi"       # protect DGX OS + Dashboard on a UMA box
  - "kube-reserved=cpu=1,memory=2Gi"
  - "eviction-hard=memory.available<4Gi"
k3s_cluster_kubeconfig_local: "{{ playbook_dir }}/../.cache/kubeconfig-{{ lab_name | default('spark-lab') }}.yaml"
