# Put this file next to the docker-compose.yml from Step 01 §7.3 on sema01,
# i.e. ~/semaphore/docker-compose.override.yml. Docker Compose merges the two.
# It changes only the 'semaphore' service (Step 04 §4):
#   * builds the lab image (Kubernetes tools + collections) instead of pulling the stock one
#   * keeps the lab state on the host (/opt/spark-lab/cache), so it survives restarts
#   * tells Ansible where the lab config and the state live
# Assumes the repository is cloned at ~/technical-depth on sema01.
---
services:
  semaphore:
    image: semaphore-spark-lab:local
    build:
      context: ../technical-depth/01 Ansible/lab
      dockerfile: semaphore/Dockerfile
      args:
        SEMAPHORE_IMAGE: semaphoreui/semaphore:latest   # pin the same tag as docker-compose.yml in production
    volumes:
      - /opt/spark-lab/cache:/var/lib/spark-lab/cache
    environment:
      # Semaphore runs ansible-playbook from the repository root, so point it at
      # the lab's ansible.cfg (roles, inventory plugins, SSH settings).
      ANSIBLE_CONFIG: "01 Ansible/lab/ansible.cfg"
      ANSIBLE_COLLECTIONS_PATH: /usr/share/ansible/collections
      # Lab state outside the temporary checkout (group_vars/all.yml → lab_cache_dir).
      SPARK_LAB_CACHE: /var/lib/spark-lab/cache
      ANSIBLE_CACHE_PLUGIN_CONNECTION: /var/lib/spark-lab/cache/facts
      ANSIBLE_LOG_PATH: /var/lib/spark-lab/cache/ansible.log
