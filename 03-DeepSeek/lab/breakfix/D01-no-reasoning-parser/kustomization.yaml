# D01: R1 served WITHOUT --reasoning-parser. Symptom: clients/Open WebUI show the
# whole chain of thought as the answer; `reasoning_content` is empty.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../k8s/models/r1-7b]
patches:
  - target: {kind: Deployment, name: vllm}
    patch: |
      - op: remove
        path: /spec/template/spec/containers/0/args/8
