# Model catalog for the 03-DeepSeek lab (Chapters 04-08, 18).
# scripts/gen_overlays.py turns every entry into k8s/models/<name>/ — a
# kustomize overlay of the 02-Kubernetes vLLM Deployment
# (root-llms/90-serving/vllm), applied to the root: kubectl --context spark-root.
# Applying an overlay replaces the model in Deployment vllm; k8s/multi/ runs a
# second or third model next to it as its own Deployment.
#
# util      vLLM --gpu-memory-utilization: a fraction of the ~121.7 GiB the GB10 reports
#           (MemTotal), the same memory the OS, Kubernetes and every pod use.
#           RULE: the sum of util over models running at the same time (incl. bge-m3 at
#           0.06) stays ≲ 0.72 — the root's ~90 GiB LLM memory pool (02-Kubernetes
#           Chapter 04, root-llms/10-tenancy/quotas.yaml). 0.20 ≈ 24 GiB.
# mem       pod memory, request = limit (the scheduler guards the shared pool): util × 121.7 GiB
#           plus a few GiB for the CPU side; sized as if CUDA memory is charged to the
#           cgroup (02-Kubernetes Chapter 14 §5.5). All model servers, Open WebUI, LiteLLM,
#           Qdrant and bge-m3 share serving-budget: 8 CPU · 90 Gi · 6 slices.
# alone     true = the model needs (nearly) the whole pool: park every other model server
#           and batch first (KEDA pause, scale to 0). Only r1-32b (BF16, util 0.70 ≈ 85 GiB).
# weights   approximate weight size on disk (for prefetch planning)
# revision  optional Hugging Face commit SHA that pins the exact weights and tokenizer
#           (tools/catalog_drift.py pin writes it; Chapter 15). Unpinned = branch main.
#
# Sets that fit together (Σ util ≤ 0.72 and Σ mem within serving-budget):
#   r1-7b + qwen2.5-7b-tools + r1-1.5b + bge-m3 + apps   0.56   28 + 28 + 14 + 9 + ~9 Gi
#   r1-32b-fp8 (or v2-lite / coder-v2-lite) + bge-m3 + apps   0.51   58 + 9 + ~9 Gi
#   mixtral-8x7b-fp8 + bge-m3 + apps                      0.61   70 + 9 + ~9 Gi
#   r1-32b alone                                          0.70   87 Gi (+ Qdrant 2 Gi)
#   r1-7b + qwen3.6-35b-nvfp4 (vllm-next) + bge-m3 + apps  0.56   28 + 40 + 9 + ~9 Gi
models:
  - name: r1-1.5b
    hf: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
    util: 0.10
    max_len: 16384
    mem: 14Gi
    weights: 3.6GB
    args: [--reasoning-parser=deepseek_r1]
    use: fastest reasoning model; speculative-decoding draft for the 7B/32B distills
  - name: r1-7b
    hf: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    util: 0.20
    max_len: 32768
    mem: 28Gi
    weights: 15GB
    args: [--reasoning-parser=deepseek_r1]
    use: everyday reasoning model on one GPU time-slice
  - name: r1-32b
    hf: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
    util: 0.70
    max_len: 16384
    mem: 87Gi
    alone: true
    weights: 66GB
    args: [--reasoning-parser=deepseek_r1, --max-num-seqs=16]
    use: best single-Spark reasoning quality in BF16 — runs alone, everything else parked
  - name: r1-32b-fp8
    hf: RedHatAI/DeepSeek-R1-Distill-Qwen-32B-FP8-dynamic
    util: 0.45
    max_len: 32768
    mem: 58Gi
    weights: 34GB
    args: [--reasoning-parser=deepseek_r1, --max-num-seqs=32]
    use: 32B quality at half the memory (FP8 W8A8, dynamic activation scales)
  - name: v2-lite
    hf: deepseek-ai/DeepSeek-V2-Lite-Chat
    util: 0.45
    max_len: 16384
    mem: 58Gi
    weights: 32GB
    args: [--trust-remote-code, --max-num-seqs=32]
    use: the MLA + DeepSeekMoE architecture of V2/V3 at a size one Spark can hold
  - name: coder-v2-lite
    hf: deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct
    util: 0.45
    max_len: 32768
    mem: 58Gi
    weights: 32GB
    args: [--trust-remote-code, --max-num-seqs=32]
    use: code completion / FIM, 16B MoE with 2.4B active
  - name: qwen2.5-7b-tools
    hf: Qwen/Qwen2.5-7B-Instruct
    util: 0.20
    max_len: 32768
    mem: 28Gi
    weights: 15GB
    args: [--enable-auto-tool-choice, --tool-call-parser=hermes]
    use: tool calling and JSON agents (Chapter 14); comparison baseline (Chapter 18)
  - name: qwen2.5-32b-awq
    hf: Qwen/Qwen2.5-32B-Instruct-AWQ
    util: 0.30
    max_len: 32768
    mem: 40Gi
    weights: 19GB
    args: [--quantization=awq_marlin, --max-num-seqs=32]
    use: dense 32B non-reasoning comparison (Chapter 18)
  - name: qwq-32b-awq
    hf: Qwen/QwQ-32B-AWQ
    util: 0.30
    max_len: 32768
    mem: 40Gi
    weights: 20GB
    args: [--quantization=awq_marlin, --max-num-seqs=32, --reasoning-parser=deepseek_r1]
    use: Qwen's own reasoning model on the same Qwen2.5-32B base — RL-trained vs R1-distilled (Chapter 18)
  - name: qwen3.6-35b-nvfp4
    hf: RedHatAI/Qwen3.6-35B-A3B-NVFP4
    util: 0.30
    max_len: 32768
    mem: 40Gi
    weights: 20GB
    args: [--reasoning-parser=qwen3, --max-num-seqs=32]
    use: step 3 of the fast lane (Chapter 06 Task 5.8) - MoE 35B/3B active in Blackwell-native NVFP4 with an MTP head; needs the newer vLLM image (k8s/upgrade/vllm-next), not 25.09
  - name: llama-3.1-8b
    hf: meta-llama/Llama-3.1-8B-Instruct
    util: 0.20
    max_len: 32768
    mem: 28Gi
    weights: 16GB
    args: [--enable-auto-tool-choice, --tool-call-parser=llama3_json]
    use: Meta baseline (Chapter 18); gated on Hugging Face — needs hf-token
  - name: r1-llama-8b
    hf: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    util: 0.20
    max_len: 32768
    mem: 28Gi
    weights: 16GB
    args: [--reasoning-parser=deepseek_r1]
    use: R1 reasoning distilled into Llama-3.1-8B — same base as llama-3.1-8b, isolates what R1 distillation adds (Chapter 18)
  - name: mistral-7b
    hf: mistralai/Mistral-7B-Instruct-v0.3
    util: 0.20
    max_len: 32768
    mem: 28Gi
    weights: 15GB
    args: [--tokenizer-mode=mistral, --config-format=mistral, --load-format=mistral]
    use: Mistral baseline (Chapter 18)
  - name: mixtral-8x7b-fp8
    hf: RedHatAI/Mixtral-8x7B-Instruct-v0.1-FP8
    util: 0.55
    max_len: 32768
    mem: 70Gi
    weights: 47GB
    args: [--max-num-seqs=32]
    use: Mistral's sparse MoE (8 experts, top-2) vs DeepSeekMoE in v2-lite (Chapter 18)
  - name: nemotron-nano-8b
    hf: nvidia/Llama-3.1-Nemotron-Nano-8B-v1
    util: 0.20
    max_len: 32768
    mem: 28Gi
    weights: 16GB
    args: []
    use: NVIDIA Nemotron reasoning model (Chapter 18); toggle reasoning with the system prompt
