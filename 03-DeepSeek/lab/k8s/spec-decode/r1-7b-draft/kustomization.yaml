# Speculative decoding (Volume 03): R1-Distill-Qwen-1.5B drafts 4 tokens per
# step for R1-Distill-Qwen-7B (same Qwen2.5 tokenizer). The 7B verifies them in
# one forward pass. Utilisation is raised a little to hold both models.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../models/r1-7b]
patches:
  - target: {kind: Deployment, name: vllm}
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: '--speculative-config={"model": "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B", "num_speculative_tokens": 4}'
      - op: replace
        path: /spec/template/spec/containers/0/args/4
        value: --gpu-memory-utilization=0.36
      - op: replace
        path: /metadata/labels/model
        value: r1-7b-draft
