# Prompt-lookup ("n-gram") speculative decoding (Volume 03): no draft model;
# candidate tokens are copied from earlier text in the prompt/output. Free when
# answers quote their context (RAG, code edits), useless for free-form prose.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../models/r1-7b]
patches:
  - target: {kind: Deployment, name: vllm}
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: '--speculative-config={"method": "ngram", "num_speculative_tokens": 4, "prompt_lookup_max": 4, "prompt_lookup_min": 2}'
      - op: replace
        path: /metadata/labels/model
        value: r1-7b-ngram
