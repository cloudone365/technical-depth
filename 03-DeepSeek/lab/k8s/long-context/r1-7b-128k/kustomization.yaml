# R1-Distill-Qwen-7B with its full 131,072-token window (Volume 08).
# KV for one full-length sequence: 131072 × 56 KiB ≈ 7 GiB — fits the 0.30
# budget; chunked prefill keeps the 128K prompt from stalling other requests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../models/r1-7b]
patches:
  - target: {kind: Deployment, name: vllm}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args/5
        value: --max-model-len=131072
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --enable-chunked-prefill
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --max-num-batched-tokens=8192
      - op: replace
        path: /metadata/labels/model
        value: r1-7b-128k
