# Tensor parallelism across TWO Sparks with LeaderWorkerSet + Ray (Chapter 04):
# DeepSeek-R1-Distill-Llama-70B in FP8 (~71 GB) split TP=2, one GB10 per rank,
# NCCL over the CX-7 link, weights shared over NFS-RDMA. dgx-spark-1 = 192.168.100.11,
# dgx-spark-2 = 192.168.100.12 on the fabric. Memory: util 0.60 ≈ 73 GiB per rank
# (≈35 GiB of weights each + KV); each pod holds 80 Gi (request = limit), most of its
# Spark's ~90 GiB LLM pool — park the other model servers and batch on both Sparks.
# Install LWS first:
#   kubectl --context spark-root apply --server-side -f https://github.com/kubernetes-sigs/lws/releases/download/v0.7.0/manifests.yaml
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata: {name: vllm-70b, namespace: llm-multinode}
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata: {labels: {role: leader, app: vllm-70b}}
      spec:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        enableServiceLinks: false   # Service 'vllm' would inject VLLM_PORT=tcp://… and vLLM refuses to start
        containers:
          - name: vllm
            image: nvcr.io/nvidia/vllm:25.09-py3
            command: ["bash", "-c"]
            args:
              - |
                ray start --head --port=6379 --node-ip-address=192.168.100.11 --disable-usage-stats
                until ray status 2>/dev/null | grep -q '/2.0 GPU'; do echo "waiting for the worker's GPU to join Ray"; sleep 5; done
                vllm serve RedHatAI/DeepSeek-R1-Distill-Llama-70B-FP8-dynamic --served-model-name r1-70b \
                  --tensor-parallel-size 2 --distributed-executor-backend ray \
                  --gpu-memory-utilization 0.60 --max-model-len 16384 --reasoning-parser deepseek_r1 \
                  --download-dir /models/hf --host 0.0.0.0 --port 8000
            env: &ncclenv
              - {name: NCCL_SOCKET_IFNAME, value: enp1s0f1np1}
              - {name: GLOO_SOCKET_IFNAME, value: enp1s0f1np1}
              - {name: NCCL_IB_HCA, value: "rocep1s0f1,roceP2p1s0f1"}
              - {name: NCCL_IB_GID_INDEX, value: "3"}
              - {name: HF_HOME, value: /models/hf}
              - {name: HF_HUB_CACHE, value: /models/hf}   # = hf download --cache-dir (model-prefetch)
            ports: [{containerPort: 8000}]
            readinessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 10, initialDelaySeconds: 120}
            securityContext: {capabilities: {add: [IPC_LOCK]}}
            resources:
              requests: {cpu: "8", memory: 80Gi, nvidia.com/gpu: "1"}   # request = limit
              limits: {memory: 80Gi, nvidia.com/gpu: "1"}
            volumeMounts: [{name: models, mountPath: /models}, {name: shm, mountPath: /dev/shm}]
        volumes:                         # dgx-spark-1 exports /srv/models over NFS-RDMA (01-Ansible Chapter 15)
          - {name: models, hostPath: {path: /srv/models, type: Directory}}
          - {name: shm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}
    workerTemplate:
      metadata: {labels: {role: worker, app: vllm-70b}}
      spec:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        enableServiceLinks: false   # Service 'vllm' would inject VLLM_PORT=tcp://… and vLLM refuses to start
        containers:
          - name: vllm
            image: nvcr.io/nvidia/vllm:25.09-py3
            command: ["bash", "-c"]
            args: ["ray start --address=192.168.100.11:6379 --node-ip-address=192.168.100.12 --block --disable-usage-stats"]
            env: *ncclenv
            securityContext: {capabilities: {add: [IPC_LOCK]}}
            resources:
              requests: {cpu: "8", memory: 80Gi, nvidia.com/gpu: "1"}   # request = limit
              limits: {memory: 80Gi, nvidia.com/gpu: "1"}
            volumeMounts: [{name: models, mountPath: /models}, {name: shm, mountPath: /dev/shm}]
        volumes:                         # dgx-spark-2 mounts the same export at /mnt/models
          - {name: models, hostPath: {path: /mnt/models, type: Directory}}
          - {name: shm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}
