# SGLang serving the FP8 R1-32B distill (Chapter 07). Park vLLM first (KEDA would
# undo a plain scale to 0):
#   kubectl --context spark-root -n llm-serving annotate scaledobject vllm autoscaling.keda.sh/paused-replicas=0 --overwrite
# --mem-fraction-static 0.45 ≈ 55 GiB of the ~90 GiB LLM pool (same rule as vLLM's
# util: Σ over engines ≲ 0.72); pod memory 58 Gi, request = limit.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../02-Kubernetes/lab/manifests/root-llms/90-serving/sglang
patches:
  - target: {kind: Deployment, name: sglang}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --model-path=RedHatAI/DeepSeek-R1-Distill-Qwen-32B-FP8-dynamic
          - --served-model-name=r1-32b-fp8
          - --host=0.0.0.0
          - --port=30000
          - --mem-fraction-static=0.45
          - --context-length=32768
          - --reasoning-parser=deepseek-r1
          - --enable-metrics
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 58Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 58Gi
