# R1-Distill-Qwen-1.5B plus the LoRA adapter trained by k8s/jobs/sft.yaml (Chapter 10).
# One base model, many adapters: each --lora-modules entry is a served model name.
#   scripts/publish-adapter.sh sft-lora && kubectl --context spark-root apply -k k8s/lora/r1-1.5b-sft
# Same budget as k8s/models/r1-1.5b (util 0.10, 14 Gi request = limit): adapters live inside the KV/util budget.
# Clients ask for "r1-1.5b" (base) or "r1-sft" (base + adapter) on the same server.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../models/r1-1.5b
patches:
  - target: {kind: Deployment, name: vllm}
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --enable-lora
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --lora-modules=r1-sft=/models/adapters/sft-lora
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --max-lora-rank=16
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --max-loras=4
