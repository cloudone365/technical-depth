# "Serve by day, train by night" on one Spark (Chapter 09).
# Replaces 02's ScaledObject 'vllm' (same name): KEDA takes the MAX of all triggers,
#   cron        1 replica Mon–Fri 08:00–20:00 (lab timezone)
#   prometheus  stay at 1 while any request is still running or waiting
# Outside those windows vLLM scales to 0: its time-slice and its memory (the pod's
# request = limit, 28–58 Gi depending on the model) go back to the root's ~90 GiB
# LLM pool. Batch only gets more of that pool when the training window quotas are
# applied (02-Kubernetes lab: kubectl --context spark-root apply -k
# manifests/root-llms/training-window; re-apply root-llms/10-tenancy and
# 20-scheduling in the morning) — schedule both with the scale-down, e.g. in Semaphore.
# Needs KEDA (02 scripts/install-addons.sh keda); Prometheus is kps on the root.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: vllm, namespace: llm-serving}
spec:
  scaleTargetRef: {name: vllm}
  minReplicaCount: 0
  maxReplicaCount: 1                   # 2 when dgx-spark-2 joins (and set strategy RollingUpdate)
  cooldownPeriod: 900                  # 15 min of quiet before scaling to 0 — a reload costs minutes
  triggers:
    - type: cron
      metadata:
        timezone: Europe/London        # set yours
        start: "0 8 * * 1-5"
        end: "0 20 * * 1-5"
        desiredReplicas: "1"
    - type: prometheus
      metadata:
        serverAddress: http://kps-prometheus.observability.svc:9090
        query: sum(vllm:num_requests_running{namespace="llm-serving"}) + sum(vllm:num_requests_waiting{namespace="llm-serving"})
        threshold: "16"
        activationThreshold: "0"       # any in-flight request keeps (or brings back) one replica
        ignoreNullValues: "true"       # no vLLM pod → no series → 0, not an error
