<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 860" width="1720" height="860" role="img" aria-label="Lab architecture" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect width="1720" height="860" fill="#ffffff"/><text x="40" y="48" font-size="30" font-weight="700" text-anchor="start" fill="#1c1f23">Lab architecture: Semaphore + Vault SSH CA + managed Ubuntu targets</text><rect x="60" y="400" width="240" height="120" rx="14" fill="#f3f4f6" stroke="#5b6470" stroke-width="2.5"/><text x="78" y="436" font-size="24" font-weight="700" text-anchor="start" fill="#1c1f23">Engineer</text><text x="78" y="468" font-size="19" font-weight="400" text-anchor="start" fill="#374151">MacBook: browser,</text><text x="78" y="496" font-size="19" font-weight="400" text-anchor="start" fill="#374151">git, ssh</text><rect x="60" y="100" width="240" height="120" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><text x="78" y="136" font-size="24" font-weight="700" text-anchor="start" fill="#1c1f23">Git repository</text><text x="78" y="168" font-size="19" font-weight="400" text-anchor="start" fill="#374151">GitHub private repo</text><text x="78" y="196" font-size="19" font-weight="400" text-anchor="start" fill="#374151">lab-playbooks</text><rect x="460" y="260" width="340" height="440" rx="14" fill="#eff6ff" stroke="#1f6feb" stroke-width="2.5"/><text x="478" y="296" font-size="24" font-weight="700" text-anchor="start" fill="#1c1f23">sema01</text><text x="478" y="328" font-size="19" font-weight="400" text-anchor="start" fill="#374151">192.168.0.210 (Docker)</text><rect x="484" y="350" width="292" height="110" rx="14" fill="#ffffff" stroke="#1f6feb" stroke-width="2.5"/><text x="502" y="384" font-size="22" font-weight="700" text-anchor="start" fill="#1c1f23">Semaphore UI :3000</text><text x="502" y="416" font-size="19" font-weight="400" text-anchor="start" fill="#374151">projects, templates, roles</text><text x="502" y="444" font-size="19" font-weight="400" text-anchor="start" fill="#374151">runs ansible-playbook</text><rect x="484" y="480" width="292" height="90" rx="14" fill="#ffffff" stroke="#1f6feb" stroke-width="2.5"/><text x="502" y="514" font-size="22" font-weight="700" text-anchor="start" fill="#1c1f23">PostgreSQL</text><text x="502" y="546" font-size="19" font-weight="400" text-anchor="start" fill="#374151">task history, keys</text><text x="484" y="612" font-size="19" font-weight="400" text-anchor="start" fill="#374151">Variable group: role_id +</text><text x="484" y="640" font-size="19" font-weight="400" text-anchor="start" fill="#374151">secret_id (stored encrypted)</text><text x="484" y="668" font-size="19" font-weight="400" text-anchor="start" fill="#374151">Play 1 mints the certificate</text><rect x="960" y="80" width="340" height="270" rx="14" fill="#ecfdf5" stroke="#0b7a75" stroke-width="2.5"/><text x="978" y="116" font-size="24" font-weight="700" text-anchor="start" fill="#1c1f23">vault01</text><text x="978" y="148" font-size="19" font-weight="400" text-anchor="start" fill="#374151">192.168.0.211</text><text x="978" y="176" font-size="19" font-weight="400" text-anchor="start" fill="#374151">raft storage, TLS on :8200</text><text x="978" y="204" font-size="19" font-weight="400" text-anchor="start" fill="#374151">SSH CA: ssh-client-signer</text><text x="978" y="232" font-size="19" font-weight="400" text-anchor="start" fill="#374151">Role 'ansible': 15-min certs</text><text x="978" y="260" font-size="19" font-weight="400" text-anchor="start" fill="#374151">AppRole 'semaphore' + policy</text><text x="978" y="288" font-size="19" font-weight="400" text-anchor="start" fill="#374151">Audit log to file</text><rect x="1420" y="260" width="270" height="440" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/><text x="1438" y="296" font-size="24" font-weight="700" text-anchor="start" fill="#1c1f23">Managed targets</text><rect x="1438" y="310" width="234" height="170" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/><text x="1456" y="344" font-size="21" font-weight="700" text-anchor="start" fill="#1c1f23">192.168.0.201</text><text x="1456" y="376" font-size="19" font-weight="400" text-anchor="start" fill="#374151">svc-ansible user</text><text x="1456" y="404" font-size="19" font-weight="400" text-anchor="start" fill="#374151">trusts Vault CA</text><text x="1456" y="432" font-size="19" font-weight="400" text-anchor="start" fill="#374151">chrony time sync</text><rect x="1438" y="500" width="234" height="170" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/><text x="1456" y="534" font-size="21" font-weight="700" text-anchor="start" fill="#1c1f23">192.168.0.202</text><text x="1456" y="566" font-size="19" font-weight="400" text-anchor="start" fill="#374151">svc-ansible user</text><text x="1456" y="594" font-size="19" font-weight="400" text-anchor="start" fill="#374151">trusts Vault CA</text><text x="1456" y="622" font-size="19" font-weight="400" text-anchor="start" fill="#374151">chrony time sync</text><rect x="960" y="740" width="340" height="80" rx="14" fill="#f3f4f6" stroke="#5b6470" stroke-width="2.5"/><text x="978" y="772" font-size="22" font-weight="700" text-anchor="start" fill="#1c1f23">NTP servers</text><text x="978" y="804" font-size="19" font-weight="400" text-anchor="start" fill="#374151">UDP 123 (internet or internal)</text><polyline points="300,460 460,460" fill="none" stroke="#5b6470" stroke-width="3" marker-end="url(#m-gray)"/><rect x="317" y="427" width="126" height="26" rx="4" fill="#ffffff"/><text x="380" y="444" font-size="17" font-weight="400" text-anchor="middle" fill="#1c1f23">browse :3000</text><polyline points="180,400 180,222" fill="none" stroke="#5b6470" stroke-width="3" marker-end="url(#m-gray)"/><rect x="189" y="301" width="88" height="26" rx="4" fill="#ffffff"/><text x="196" y="318" font-size="17" font-weight="400" text-anchor="start" fill="#1c1f23">git push</text><polyline points="460,300 300,170" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#m-purple)"/><rect x="243" y="245" width="163" height="26" rx="4" fill="#ffffff"/><text x="250" y="262" font-size="17" font-weight="400" text-anchor="start" fill="#1c1f23">HTTPS :443 clone</text><polyline points="800,320 960,320" fill="none" stroke="#0b7a75" stroke-width="3" marker-end="url(#m-teal)"/><rect x="822" y="263" width="116" height="26" rx="4" fill="#ffffff"/><text x="880" y="280" font-size="17" font-weight="400" text-anchor="middle" fill="#1c1f23">HTTPS :8200</text><rect x="817" y="285" width="126" height="26" rx="4" fill="#ffffff"/><text x="880" y="302" font-size="17" font-weight="400" text-anchor="middle" fill="#1c1f23">login + sign</text><polyline points="800,560 1420,560" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#m-amber)"/><rect x="930" y="527" width="360" height="27" rx="4" fill="#ffffff"/><text x="1110" y="545" font-size="18" font-weight="400" text-anchor="middle" fill="#1c1f23">SSH :22 key + 15-minute certificate</text><polyline points="1300,250 1420,250" fill="none" stroke="#0b7a75" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#m-teal)"/><rect x="1293" y="215" width="135" height="26" rx="4" fill="#ffffff"/><text x="1360" y="232" font-size="17" font-weight="400" text-anchor="middle" fill="#1c1f23">CA public key</text><polyline points="1555,700 1555,780 1300,780" fill="none" stroke="#5b6470" stroke-width="3" marker-end="url(#m-gray)"/><rect x="1391" y="751" width="79" height="26" rx="4" fill="#ffffff"/><text x="1430" y="768" font-size="17" font-weight="400" text-anchor="middle" fill="#1c1f23">UDP 123</text><text x="40" y="840" font-size="17" font-weight="400" text-anchor="start" fill="#5b6470">Solid lines: runtime traffic. Dashed line: one-time trust setup (CA public key placed on each target).</text></svg>