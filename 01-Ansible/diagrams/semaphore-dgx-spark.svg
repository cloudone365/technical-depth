<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="770" viewBox="0 0 1100 770" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">dgx-spark-1 as a Semaphore target</title>
<desc id="d">Management plane outside the Spark: sema01 runs Semaphore with a lab image that acts as the Ansible controller, PostgreSQL and a state volume; vault01 holds the SSH CA, the semaphore AppRole and the lab secrets. In each task Semaphore first logs in to vault01 and gets a 15-minute certificate, then SSHes to dgx-spark-1 as svc-ansible, then runs kubectl and helm against the root cluster API on port 6443. The root cluster spark-root contains the vClusters dev-lab and llms. The MacBook uses the browser, git and kubectl, and SSH as the admin user only for bootstrap and break-glass. The existing Step 01 targets 192.168.0.201 and .202 stay in the project lab.</desc>
