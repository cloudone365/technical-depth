---
# Headless DGX OS (Chapter 04 §6.3): no desktop session on a server you reach
# over SSH. Switching the target now stops the display manager and the GNOME
# session at once; SSH sessions are not affected. Idempotent: compares first.
- name: Current default boot target
  ansible.builtin.command: systemctl get-default   # noqa: command-instead-of-module  (no module reads the default target)
  register: spark_baseline_default_target
  changed_when: false
  check_mode: false                       # read-only: also runs in --check, so the 'when' below works

- name: Memory available before
  ansible.builtin.command: awk '/MemAvailable/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo
  register: spark_baseline_mem_before
  changed_when: false
  check_mode: false

- name: Boot to text mode from now on (multi-user.target)
  ansible.builtin.command: systemctl set-default multi-user.target   # noqa: command-instead-of-module
  when: spark_baseline_default_target.stdout != 'multi-user.target'
  changed_when: true

- name: Leave the graphical target now (stops gdm and the desktop session, no reboot)
  ansible.builtin.command: systemctl isolate multi-user.target   # noqa: command-instead-of-module
  when: spark_baseline_default_target.stdout != 'multi-user.target'
  changed_when: true

- name: Memory available after
  ansible.builtin.command: awk '/MemAvailable/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo
  register: spark_baseline_mem_after
  changed_when: false
  check_mode: false

- name: Report
  ansible.builtin.debug:
    msg: >-
      default target {{ spark_baseline_default_target.stdout }} → multi-user.target;
      MemAvailable {{ spark_baseline_mem_before.stdout }} → {{ spark_baseline_mem_after.stdout }}
