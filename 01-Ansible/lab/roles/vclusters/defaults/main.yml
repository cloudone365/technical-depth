---
# Two virtual clusters inside the root cluster (02-Kubernetes Chapter 04).
# The definitions are NOT duplicated here: this role applies the files in the
# 02-Kubernetes lab, so Ansible and the lab scripts can never drift apart.
vclusters_lab_dir: "{{ playbook_dir }}/../../../02-Kubernetes/lab"
vclusters_chart_version: "0.37.1"            # pin; standard Kubernetes distro (vCluster ≥ 0.33 has no K3s)
vclusters_kubeconfig: "{{ lab_cache_dir | default(playbook_dir ~ '/../.cache') }}/kubeconfig-{{ lab_name | default('spark-lab') }}.yaml"
vclusters_root_context: spark-root

# Each vCluster keeps its SQLite database on a PVC (storageClass local-nvme),
# so the storage add-on must exist first. Same steps as
# "02-Kubernetes/lab/scripts/install-addons.sh storage".
vclusters_local_path_version: v0.0.31

# Root-side objects first: kustomize directories under manifests/root, the same
# ones scripts/apply-lab.sh applies. 00-platform = platform namespaces and the
# PriorityClasses (vCluster control planes run at spark-platform; no default
# class on the root, see 02-Kubernetes Chapter 07 §3.1); 05-vclusters = the
# vCluster namespaces, LimitRanges, the budgets (ResourceQuotas) and Cilium policies.
vclusters_root_manifests:
  - 00-platform
  - 05-vclusters

vclusters_list:
  - { name: dev-lab, namespace: vc-dev-lab }   # vCluster #1 — 2 CPU · 8 Gi · 2 GPU slices
  - { name: llms, namespace: vc-llms }         # vCluster #2 — 12 CPU · 88 Gi · 11 GPU slices
