---
# MetalLB gives LoadBalancer Services a real IP on the mgmt LAN (Chapter 19).
# kubeadm has no built-in load balancer (k3s had servicelb). Layer 2 mode:
# the node answers ARP for the Service IP — no router configuration needed.
metallb_chart_version: "0.16.0"              # pin; check `helm search repo metallb/metallb -l`
# Layer 2 only. Chart 0.16 turns on the frr-k8s BGP backend by default, and its
# bundled values leave frr-k8s.prometheus empty, which breaks the subchart's
# templates ("nil pointer evaluating … serviceMonitor"). The lab has no BGP
# router, so the native speaker is all it needs.
metallb_values:
  frrk8s:
    enabled: false
metallb_namespace: metallb-system
metallb_kubeconfig: "{{ lab_cache_dir | default(playbook_dir ~ '/../.cache') }}/kubeconfig-{{ lab_name | default('spark-lab') }}.yaml"
metallb_context: spark-root

# Reserve this range in your router's DHCP settings so nothing else takes it.
#   .111 dev-lab vCluster API · .112 dev-llms vCluster API · .115 LLM gateway (Traefik on the root)
metallb_pool_name: lab-pool
metallb_pool_addresses: [192.168.0.110-192.168.0.119]
metallb_l2_interfaces: ["{{ mgmt_interface | default('enP7s7') }}"]
