# Root API server audit policy — who changed what (02-Kubernetes Chapter 03).
# Installed to /etc/kubernetes/audit/audit-policy.yaml by the 01-Ansible
# kubeadm_cluster role; an identical copy is kept at
# "02-Kubernetes/lab/kubeadm/audit-policy.yaml" (tests diff the two).
# Each vCluster has its own API server: tenant actions inside a vCluster are
# audited there, and appear here only as writes by that vCluster's syncer.
---
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: ["RequestReceived"]
rules:
  # Never log secret payloads
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps"]
  # Noise: kubelet/system reads
  - level: None
    users: ["system:kube-proxy", "system:apiserver"]
  - level: None
    verbs: ["get", "list", "watch"]
    userGroups: ["system:nodes", "system:serviceaccounts:kube-system"]
  - level: None
    nonResourceURLs: ["/healthz*", "/readyz*", "/livez*", "/version", "/metrics"]
  # Everything that mutates tenant clusters or GPU state: full request
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    namespaces: ["vc-dev-lab", "vc-llms", "gpu-operator", "platform-tools"]
  - level: Metadata
