---
- name: Keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Kubernetes apt signing key (per minor version)
  ansible.builtin.get_url:
    url: "{{ kubeadm_cluster_apt_repo }}Release.key"
    dest: "/etc/apt/keyrings/kubernetes-v{{ kubeadm_cluster_minor }}.asc"
    mode: "0644"

- name: Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-v{{ kubeadm_cluster_minor }}.asc]
      {{ kubeadm_cluster_apt_repo }} /
    filename: kubernetes
    state: present

- name: Refresh the package index (the repository was just added on a first run)
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

- name: Versions of kubeadm the repository offers
  ansible.builtin.command: apt-cache madison kubeadm
  register: kubeadm_cluster_madison
  changed_when: false
  check_mode: false        # read-only probe: must also run under --check (drift detection)

- name: The pinned version exists in the repository
  ansible.builtin.assert:
    that: (kubeadm_cluster_version ~ kubeadm_cluster_package_suffix) in kubeadm_cluster_madison.stdout
    fail_msg: >-
      kubeadm {{ kubeadm_cluster_version }}{{ kubeadm_cluster_package_suffix }} is not in
      {{ kubeadm_cluster_apt_repo }}. Available:
      {{ kubeadm_cluster_madison.stdout_lines | map('split', '|') | map(attribute=1) | map('trim') | list }}.
      Set kubeadm_cluster_version (roles/kubeadm_cluster/defaults/main.yml or an extra variable).
    quiet: true

- name: Which Kubernetes packages are installed already?
  ansible.builtin.package_facts:
    manager: apt

# dpkg_selections fails on a package that isn't installed, so on a first run
# there is nothing to release and this task skips. Only a package whose
# installed version differs from the pin is released: releasing an unchanged
# one would make "Hold Kubernetes packages" report changed on every run.
- name: Release the hold so a version change can apply
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop: "{{ ['kubelet', 'kubeadm', 'kubectl'] | select('in', ansible_facts.packages) | list }}"
  when: ansible_facts.packages[item][0].version != (kubeadm_cluster_version ~ kubeadm_cluster_package_suffix)
  changed_when: false

- name: Install kubelet, kubeadm, kubectl (exact version)
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubeadm_cluster_version }}{{ kubeadm_cluster_package_suffix }}"
      - "kubeadm={{ kubeadm_cluster_version }}{{ kubeadm_cluster_package_suffix }}"
      - "kubectl={{ kubeadm_cluster_version }}{{ kubeadm_cluster_package_suffix }}"
    state: present
    update_cache: true
  register: kubeadm_cluster_apt
  retries: 3
  delay: 10
  until: kubeadm_cluster_apt is succeeded

# crictl (the CRI command line: crictl ps/images/logs) is not pulled in by the
# kubeadm package on every release, so install it explicitly. It comes from the
# same pkgs.k8s.io repository, so it matches the cluster's minor version.
- name: Install crictl (cri-tools)
  ansible.builtin.apt:
    name: cri-tools
    state: present
  register: kubeadm_cluster_critools
  retries: 3
  delay: 10
  until: kubeadm_cluster_critools is succeeded

# A routine 'apt upgrade' must never move the cluster version (same idea as the
# NVIDIA package holds in spark_baseline). Upgrades go through 'kubeadm upgrade'.
- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: Kubelet enabled (it crash-loops until kubeadm writes its config; that is normal)
  ansible.builtin.service:
    name: kubelet
    enabled: true
