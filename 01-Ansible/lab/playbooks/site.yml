---
# Full build, as one Semaphore task (template "site"). Each stage can also run
# on its own. Not included, on purpose:
#   00-bootstrap.yml, 00b-semaphore-target.yml — run once from the MacBook, before Semaphore can log in
#   08-vault.yml — needs an admin token for vault01; run from the MacBook (Step 04 §6)
- name: Baseline
  ansible.builtin.import_playbook: 01-baseline.yml
- name: Fabric
  ansible.builtin.import_playbook: 02-fabric.yml
- name: Containers
  ansible.builtin.import_playbook: 03-containers.yml
- name: Telemetry
  ansible.builtin.import_playbook: 04-telemetry.yml
- name: Kubernetes (kubeadm root cluster + Cilium + MetalLB)
  ansible.builtin.import_playbook: 05-kubernetes.yml
- name: GPU Operator
  ansible.builtin.import_playbook: 06-gpu-operator.yml
- name: Virtual clusters (dev-lab, llms)
  ansible.builtin.import_playbook: 06b-vclusters.yml
- name: Slurm
  ansible.builtin.import_playbook: 07-slurm.yml
- name: Shared storage
  ansible.builtin.import_playbook: 09-nfs-rdma.yml
- name: Validate
  ansible.builtin.import_playbook: 30-validate.yml
