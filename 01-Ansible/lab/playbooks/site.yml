---
# Full build, as one Semaphore task (template "site"). Each stage can also run
# on its own. Not included, on purpose:
#   03.1-bootstrap.yml, 04.1-semaphore-target.yml — run once from the MacBook, before Semaphore can log in
#   17.1-vault.yml — needs an admin token for vault01; run from the MacBook (Chapter 04 §6)
- name: Baseline
  ansible.builtin.import_playbook: 02.2-baseline.yml
- name: Fabric
  ansible.builtin.import_playbook: 13.1-fabric.yml
- name: Containers
  ansible.builtin.import_playbook: 11.1-containers.yml
- name: Telemetry
  ansible.builtin.import_playbook: 12.1-telemetry.yml
- name: Kubernetes (kubeadm root cluster + Cilium + MetalLB)
  ansible.builtin.import_playbook: 19.1-kubernetes.yml
- name: GPU Operator
  ansible.builtin.import_playbook: 20.1-gpu-operator.yml
- name: Virtual clusters (dev-lab, llms)
  ansible.builtin.import_playbook: 20.2-vclusters.yml
- name: Slurm
  ansible.builtin.import_playbook: 22.1-slurm.yml
- name: Shared storage
  ansible.builtin.import_playbook: 15.1-nfs-rdma.yml
- name: Validate
  ansible.builtin.import_playbook: 30.1-validate.yml
