---
# Make every Spark a Semaphore target (Chapter 04 §3) — the same host-side trust
# as Chapter 01 §5, automated:
#   * account svc-ansible: no password, NOPASSWD sudo (the controls sit in front of it)
#   * sshd trusts vault01's SSH CA, and svc-ansible may only log in with a key/certificate
#
# Run ONCE from your MacBook, right after 03.1-bootstrap.yml, as the admin user:
#   scp vault01:~/vault-ca.crt .cache/vault-ca.crt        # Vault's TLS certificate (Chapter 01 §3.3)
#   ansible-playbook playbooks/04.1-semaphore-target.yml -l dgx-spark-1,localhost -K
# Afterwards Semaphore runs everything else — including this playbook again, if
# vault01's CA ever changes.
- name: Short-lived SSH certificate from vault01 (Semaphore runs only)
  ansible.builtin.import_playbook: 00-vault-cert.yml

- name: Fetch vault01's SSH CA public key
  hosts: localhost
  connection: local
  gather_facts: false
  check_mode: false
  tasks:
    - name: Read the CA public key (public endpoint, no token needed)
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ vault_ssh_mount }}/public_key"
        ca_path: "{{ vault_cacert }}"
        return_content: true
      register: target_vault_ca

    - name: The CA key must be one line starting with ssh-
      ansible.builtin.assert:
        that:
          - target_vault_ca.content is match('^ssh-')
          - (target_vault_ca.content | trim).splitlines() | length == 1
        fail_msg: "Unexpected CA key from {{ vault_addr }}: is the SSH engine mounted at {{ vault_ssh_mount }}?"
        quiet: true

- name: Automation account and CA trust on the Sparks
  hosts: spark
  become: true
  gather_facts: false
  vars:
    target_ca_key: "{{ hostvars['localhost'].target_vault_ca.content | trim }}"
  tasks:
    - name: Automation account (no password, certificate login only)
      ansible.builtin.user:
        name: "{{ vault_ssh_principal }}"
        shell: /bin/bash
        create_home: true
        password: "!"
        update_password: on_create

    - name: Passwordless sudo for the automation account only
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-{{ vault_ssh_principal }}
        content: "{{ vault_ssh_principal }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Trust vault01's SSH CA
      ansible.builtin.copy:
        dest: /etc/ssh/trusted-user-ca-keys.pem
        content: "{{ target_ca_key }}\n"
        owner: root
        group: root
        mode: "0644"
      notify: Reload sshd

    - name: Accept CA-signed certificates; key/certificate only for the automation account
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-vault-ca.conf
        content: |
          # {{ ansible_managed | default('Managed by Ansible') }} — 04.1-semaphore-target.yml
          TrustedUserCAKeys /etc/ssh/trusted-user-ca-keys.pem
          Match User {{ vault_ssh_principal }}
              PasswordAuthentication no
              AuthenticationMethods publickey
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

    - name: Remove the drop-in of the old on-Spark Vault (replaced by 10-vault-ca.conf)
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/50-vault-ca.conf
        state: absent
      notify: Reload sshd

    - name: Apply sshd changes before checking
      ansible.builtin.meta: flush_handlers

    - name: Read the effective sshd settings
      ansible.builtin.command: /usr/sbin/sshd -T
      register: target_sshd
      changed_when: false
      check_mode: false

    - name: Check sshd loaded the CA
      ansible.builtin.assert:
        that: "'trustedusercakeys /etc/ssh/trusted-user-ca-keys.pem' in target_sshd.stdout"
        fail_msg: sshd did not load TrustedUserCAKeys — see Chapter 04 §3.2
        quiet: true

  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: ssh
        state: reloaded
