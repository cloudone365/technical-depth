---
# Two virtual clusters inside the root cluster (02-Kubernetes Step 04):
#   vCluster #1 dev-lab : 2 CPU · 8 Gi · 2 GPU slices   → https://192.168.0.111
#   vCluster #2 llms    : 4 CPU · 48 Gi · 8 GPU slices  → https://192.168.0.112
# The root keeps the rest (14 CPU · ~64 GiB · 5 slices) for platform services.
#
# Definitions come from "02-Kubernetes/lab/vclusters" and
# "02-Kubernetes/lab/manifests/root/05-vclusters" — edit them there.
#
#   ansible-playbook playbooks/06b-vclusters.yml
- name: VClusters dev-lab and llms
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: vclusters
