---
# HashiCorp Vault ↔ Ansible, the production pattern, run as a Semaphore task
# (01-Ansible Chapter 18, Chapter 04 §7):
#   1. Semaphore's variable group holds the AppRole role_id + secret_id (encrypted)
#   2. play 1 (00-vault-cert.yml) logs in → short-lived token (10 min, policies
#      semaphore-ssh + spark-lab-read) and gets a 15-minute SSH certificate
#   3. with vault_lab_secrets_enabled=true the same token reads kv/spark-lab/*
#   4. the secrets are used on the Sparks — never written to the repo or the task log
#
# Semaphore template "18.1 Vault integration" (variable group vault-approle,
# extra variable vault_lab_secrets_enabled=true). From the MacBook there is no
# AppRole, so the play below stops with an explanation.
- name: Short-lived SSH certificate from vault01 (Semaphore runs only)
  ansible.builtin.import_playbook: 00-vault-cert.yml

- name: Check what Vault handed out
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: This playbook demonstrates the Semaphore path
      ansible.builtin.assert:
        that:
          - vault_role_id is defined
          - vault_lab_secrets_enabled | bool
        fail_msg: >-
          Run it from Semaphore with the vault-approle variable group and
          vault_lab_secrets_enabled=true (Chapter 04 §7). 17.1-vault.yml must have run once.
        quiet: true

    - name: What we got (no secret values)
      ansible.builtin.debug:
        msg:
          - "SSH certificate: {{ vault_ssh_key_dir }}/id_ed25519-cert.pub (inspect: ssh-keygen -L -f …)"
          - "Lab secrets read from {{ vault_kv_mount }}/{{ vault_kv_prefix }}/: {{ (vault_lab_secrets | default({})).keys() | list }}"
          - "NGC key present: {{ (vault_lab_secrets.ngc.api_key | default('')) not in ['', 'REPLACE_ME'] }}"

- name: Use the secrets on the Sparks
  hosts: spark
  become: true
  gather_facts: false
  vars:
    container_runtime_ngc_api_key: "{{ hostvars['localhost'].vault_lab_secrets.ngc.api_key | default('') }}"
    container_runtime_ngc_login: "{{ container_runtime_ngc_api_key not in ['', 'REPLACE_ME'] }}"
    container_runtime_smoke_test: false
  roles:
    - role: container_runtime
