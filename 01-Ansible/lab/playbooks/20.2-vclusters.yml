---
# Two small virtual clusters inside the root cluster, and the root's LLM
# budgets (02-Kubernetes Chapter 04):
#   vCluster #1 dev-lab  : 2 CPU · 8 Gi · 2 GPU slices  → https://192.168.0.111
#   vCluster #2 dev-llms : 2 CPU · 8 Gi · 2 GPU slices  → https://192.168.0.112
#   root keeps 13 CPU · ~89.7 GiB · 11 slices (after the kubelet's reservations):
#     platform 3 · ~9.7 GiB · 2 | llm-serving 8 · 68 Gi · 6 | batch 2 · 12 Gi · 3
# The LLMs run on the root; its add-ons (Traefik, Kueue, KEDA) come from
# "02-Kubernetes/lab/scripts/install-addons.sh".
#
# Definitions come from "02-Kubernetes/lab/vclusters",
# "02-Kubernetes/lab/manifests/root/05-vclusters" and
# "02-Kubernetes/lab/manifests/root-llms" — edit them there.
#
#   ansible-playbook playbooks/20.2-vclusters.yml
- name: VClusters dev-lab and dev-llms, and the root's LLM budgets
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: vclusters
